<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VJP 採用ダッシュボード</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f5f7;--card:#fff;--border:#e5e5ea;--text:#1d1d1f;--sub:#86868b;--accent:#0071e3;--open:#34c759;--close:#ff3b30;--hold:#ff9500;--high:#ff3b30;--mid:#ff9500;--low:#86868b;--hire:#34c759;--reject:#ff3b30;--shadow:0 1px 3px rgba(0,0,0,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
.header{background:#1d1d1f;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.header h1{font-size:18px;font-weight:600;letter-spacing:.5px}
.header .meta{font-size:12px;color:#a1a1a6}
.header .actions{display:flex;gap:8px;align-items:center}
.header .actions button{background:rgba(255,255,255,.15);color:#fff;border:none;padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer}
.header .actions button:hover{background:rgba(255,255,255,.25)}
.sync-status{font-size:11px;padding:3px 10px;border-radius:10px;display:inline-block}
.sync-ok{background:#34c759;color:#fff}
.sync-saving{background:#ff9500;color:#fff}
.sync-err{background:#ff3b30;color:#fff}
.sync-offline{background:#86868b;color:#fff}
.stats{display:flex;gap:12px;padding:16px 24px;background:#fff;border-bottom:1px solid var(--border)}
.stat{text-align:center;padding:8px 16px;min-width:100px}
.stat .num{font-size:24px;font-weight:700}
.stat .lbl{font-size:11px;color:var(--sub);margin-top:2px}
.tabs{display:flex;gap:0;background:#fff;border-bottom:1px solid var(--border);padding:0 24px}
.tab{padding:12px 20px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:var(--sub);transition:.2s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.content{padding:20px 24px;max-width:1400px;margin:0 auto}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
thead{background:#fafafa}
th{padding:10px 12px;text-align:left;font-size:12px;font-weight:600;color:var(--sub);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #f0f0f0;font-size:13px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:hover{background:#f8f8fa}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600}
.badge-open{background:#e8f8ec;color:#1b7a2e}
.badge-close{background:#fce8e8;color:#c41e1e}
.badge-hold{background:#fff3e0;color:#b56a00}
.badge-unpub{background:#f0f0f5;color:#666}
.pri-high{color:var(--high);font-weight:700}
.pri-mid{color:var(--mid);font-weight:600}
.pri-low{color:var(--low)}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-bar label{font-size:12px;color:var(--sub);margin-right:4px}
.filter-bar select,.filter-bar input{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:#fff}
.filter-bar .btn{padding:6px 14px;border:1px solid var(--border);border-radius:6px;font-size:12px;cursor:pointer;background:#fff}
.filter-bar .btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-bar .btn:hover{border-color:var(--accent)}
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.kanban-col{min-width:220px;max-width:280px;flex:1;background:#f0f0f5;border-radius:10px;padding:12px}
.kanban-col h3{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:10px;display:flex;justify-content:space-between}
.kanban-col h3 .cnt{background:var(--accent);color:#fff;border-radius:10px;padding:0 8px;font-size:11px}
.cand-card{background:var(--card);border-radius:8px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;transition:.2s}
.cand-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.cand-card .name{font-weight:600;font-size:13px}
.cand-card .pos{font-size:11px;color:var(--sub);margin-top:2px}
.cand-card .date{font-size:10px;color:var(--sub);margin-top:4px}
.cand-card.stale{opacity:.55}
.cand-card.stale .date{color:var(--close)}
.cand-card .judgment{font-size:11px;margin-top:4px}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:100;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;max-width:700px;width:90%;max-height:85vh;overflow-y:auto;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h2{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal .close-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--sub);padding:4px 8px}
.modal .field{margin-bottom:12px}
.modal .field label{display:block;font-size:11px;font-weight:600;color:var(--sub);margin-bottom:4px}
.modal .field input,.modal .field select,.modal .field textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit}
.modal .field textarea{min-height:60px;resize:vertical}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .btn-primary{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.modal .btn-primary:hover{background:#005bb5}
.modal .btn-danger{background:var(--close);color:#fff;border:none;padding:8px 16px;border-radius:6px;font-size:12px;cursor:pointer}
.modal .btn-secondary{background:#f0f0f5;color:var(--text);border:none;padding:8px 16px;border-radius:6px;font-size:12px;cursor:pointer}
.modal .detail-section{margin-bottom:16px}
.modal .detail-section h4{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:6px;border-bottom:1px solid var(--border);padding-bottom:4px}
.modal .detail-section p{font-size:13px;line-height:1.6;white-space:pre-wrap}
.modal .detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.modal .detail-item{background:#f8f8fa;padding:8px;border-radius:6px}
.modal .detail-item .di-label{font-size:10px;color:var(--sub);font-weight:600}
.modal .detail-item .di-value{font-size:13px;margin-top:2px}
.funnel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.funnel-header h3{font-size:15px;font-weight:600}
.week-nav{display:flex;align-items:center;gap:8px}
.week-nav button{background:#f0f0f5;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.week-nav button:hover{background:#e0e0e5}
.week-nav .week-label{font-size:13px;font-weight:600;min-width:200px;text-align:center}
.funnel-table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.funnel-table th{background:#fafafa;padding:8px 10px;font-size:11px;text-align:center;border:1px solid var(--border)}
.funnel-table td{padding:6px 8px;text-align:center;font-size:12px;border:1px solid #f0f0f0}
.funnel-table td:first-child{text-align:left;font-weight:500;min-width:140px}
.funnel-table input[type=number]{width:50px;padding:4px;border:1px solid var(--border);border-radius:4px;text-align:center;font-size:12px}
.funnel-table .subtotal{font-weight:700;background:#f8f8fa}
.add-btn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.add-btn:hover{background:#005bb5}
.clickable{cursor:pointer;color:var(--accent)}
.clickable:hover{text-decoration:underline}
.dept-group{margin-bottom:20px}
.dept-group-header{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:6px 0}
.dept-group-header h3{font-size:14px;font-weight:700;color:var(--text)}
.dept-group-header .dept-count{background:var(--accent);color:#fff;font-size:11px;padding:1px 8px;border-radius:10px;font-weight:600}
.dept-group-header .dept-open{background:var(--open);color:#fff;font-size:11px;padding:1px 8px;border-radius:10px;font-weight:600}
.jd-content{background:#f8f8fa;border-radius:8px;padding:16px;font-size:13px;line-height:1.8;white-space:pre-wrap;border-left:3px solid var(--accent)}
.resume-upload{border:2px dashed var(--border);border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:.2s;background:#fafafa}
.resume-upload:hover{border-color:var(--accent);background:#f0f5ff}
.resume-link{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:#f0f5ff;border-radius:6px;font-size:13px;color:var(--accent);text-decoration:none}
.resume-link:hover{background:#e0ecff}
.toast{position:fixed;bottom:20px;right:20px;background:#1d1d1f;color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;z-index:200;display:none;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
/* Setup dialog */
.setup-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:300;display:flex;justify-content:center;align-items:center}
.setup-box{background:#fff;border-radius:16px;max-width:520px;width:90%;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.setup-box h2{font-size:20px;margin-bottom:8px}
.setup-box p{font-size:13px;color:var(--sub);margin-bottom:16px;line-height:1.6}
.setup-box .steps{background:#f8f8fa;border-radius:8px;padding:16px;margin-bottom:16px;font-size:13px;line-height:1.8}
.setup-box .steps a{color:var(--accent)}
.setup-box input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:12px}
.setup-box button{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.setup-box button:hover{background:#005bb5}
.setup-box .err{color:var(--close);font-size:12px;margin-bottom:8px;display:none}
.setup-box .skip{text-align:center;margin-top:12px;font-size:12px;color:var(--sub)}
.setup-box .skip a{color:var(--accent);cursor:pointer}
.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.9);z-index:250;display:flex;justify-content:center;align-items:center;font-size:16px;color:var(--sub)}
@media(max-width:768px){
  .content{padding:12px}
  .kanban{flex-direction:column}
  .kanban-col{max-width:100%;min-width:100%}
  .modal .row{grid-template-columns:1fr}
  .stats{flex-wrap:wrap}
  .header{padding:12px 16px}
}

/* Login screen */
.login-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#1d1d1f 0%,#2d2d3f 100%);z-index:400;display:flex;justify-content:center;align-items:center}
.login-box{background:#fff;border-radius:20px;max-width:400px;width:90%;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
.login-box .logo{font-size:28px;font-weight:700;letter-spacing:2px;margin-bottom:4px;color:#1d1d1f}
.login-box .subtitle{font-size:13px;color:var(--sub);margin-bottom:32px}
.login-box input{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;text-align:center;margin-bottom:16px;outline:none;transition:border .2s}
.login-box input:focus{border-color:var(--accent)}
.login-box input::placeholder{color:#c7c7cc}
.login-box .login-btn{width:100%;padding:14px;background:#1d1d1f;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.login-box .login-btn:hover{background:#333}
.login-box .login-err{color:var(--close);font-size:13px;margin-bottom:12px;display:none}
.login-box .powered{font-size:11px;color:#c7c7cc;margin-top:24px}
/* Token setup (friendlier version) */
.token-setup-box{background:#fff;border-radius:16px;max-width:460px;width:90%;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
.token-setup-box h3{font-size:18px;margin-bottom:8px}
.token-setup-box p{font-size:13px;color:var(--sub);line-height:1.6;margin-bottom:20px}
.token-setup-box input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:16px}
.token-setup-box .setup-btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.token-setup-box .setup-btn:hover{background:#005bb5}
.token-setup-box .setup-err{color:var(--close);font-size:12px;margin-bottom:8px;display:none}
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="logo">VJP 採用管理</div>
    <div class="subtitle">VIVAIA Japan ・ チームダッシュボード</div>
    <div class="login-err" id="loginErr">パスワードが違います</div>
    <input type="password" id="loginPassword" placeholder="チームパスワード" onkeydown="if(event.key==='Enter')checkLogin()">
    <button class="login-btn" onclick="checkLogin()">ログイン</button>
    <div class="powered">Powered by GitHub</div>
  </div>
</div>

<div class="header">
  <div>
    <h1>VJP 採用ダッシュボード</h1>
    <div class="meta">VIVAIA Japan ・ GitHub協作版</div>
  </div>
  <div class="actions">
    <span id="syncStatus" class="sync-status sync-offline">未接続</span>
    <button onclick="syncFromGitHub()">🔄 同期</button>
    <button onclick="exportData()">📤 エクスポート</button>
    <button onclick="document.getElementById('importFile').click()">📥 インポート</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    <button onclick="showTokenSetup()">⚙️</button>
  </div>
</div>

<div class="stats" id="statsBar"></div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('positions')">ポジション一覧</div>
  <div class="tab" onclick="switchTab('candidates')">候補者パイプライン</div>
  <div class="tab" onclick="switchTab('funnel')">週次ファネル</div>
</div>

<div class="content" id="content"><div class="loading-overlay">読み込み中...</div></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast" id="toast"></div>

<div id="setupOverlay"></div>

<script>
// ===== LOGIN =====
const PW_HASH = '506c92291bb7a59d9c6357184388dd81cd192140516a68220ab93c77f46b5b0e';
const LS_AUTH_KEY = 'vjp_auth';
const GH_TOKEN_FILE = 'token.enc';
let TEAM_PASSWORD = '';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// AES encrypt/decrypt using team password
async function deriveKey(password) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: enc.encode('vjp-salt-2026'), iterations:100000, hash:'SHA-256'},
    keyMaterial, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
  );
}

async function encryptToken(token, password) {
  const key = await deriveKey(password);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const ct = await crypto.subtle.encrypt({name:'AES-GCM',iv}, key, enc.encode(token));
  // Combine iv + ciphertext, base64 encode
  const combined = new Uint8Array(iv.length + ct.byteLength);
  combined.set(iv);
  combined.set(new Uint8Array(ct), iv.length);
  return btoa(String.fromCharCode(...combined));
}

async function decryptToken(encrypted, password) {
  try {
    const key = await deriveKey(password);
    const raw = Uint8Array.from(atob(encrypted), c=>c.charCodeAt(0));
    const iv = raw.slice(0,12);
    const ct = raw.slice(12);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM',iv}, key, ct);
    return new TextDecoder().decode(pt);
  } catch(e) { return null; }
}

// Try to fetch encrypted token from GitHub (public repo - no auth needed)
async function fetchEncryptedToken() {
  try {
    const url = 'https://raw.githubusercontent.com/Sini870522/vjp-hire-dashboard/main/' + GH_TOKEN_FILE + '?t=' + Date.now();
    const res = await fetch(url);
    if (!res.ok) return null;
    return await res.text();
  } catch(e) { return null; }
}

// Save encrypted token to public repo (needs a token with write access to public repo)
async function saveEncryptedToken(encryptedData, writeToken) {
  const url = 'https://api.github.com/repos/Sini870522/vjp-hire-dashboard/contents/' + GH_TOKEN_FILE;
  // Check if file exists to get SHA
  let sha = '';
  try {
    const check = await fetch(url, {headers:{'Authorization':'token '+writeToken,'Accept':'application/vnd.github.v3+json'}});
    if (check.ok) { const d = await check.json(); sha = d.sha; }
  } catch(e){}
  
  const body = {
    message: 'Update encrypted config',
    content: btoa(unescape(encodeURIComponent(encryptedData)))
  };
  if (sha) body.sha = sha;
  const res = await fetch(url, {
    method:'PUT',
    headers:{'Authorization':'token '+writeToken,'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  return res.ok;
}

async function checkLogin() {
  const pw = document.getElementById('loginPassword').value;
  const hash = await sha256(pw);
  if (hash === PW_HASH) {
    TEAM_PASSWORD = pw;
    sessionStorage.setItem(LS_AUTH_KEY, '1');
    sessionStorage.setItem('vjp_pw', pw);
    document.getElementById('loginOverlay').style.display = 'none';
    afterLogin();
  } else {
    const err = document.getElementById('loginErr');
    err.style.display = 'block';
    document.getElementById('loginPassword').value = '';
    document.getElementById('loginPassword').focus();
    setTimeout(()=>{err.style.display='none'}, 3000);
  }
}

function checkAuth() {
  if (sessionStorage.getItem(LS_AUTH_KEY) === '1') {
    TEAM_PASSWORD = sessionStorage.getItem('vjp_pw') || '';
    return true;
  }
  return false;
}

async function afterLogin() {
  document.getElementById('content').innerHTML = '<div class="loading-overlay">データ読み込み中...</div>';
  
  // 1. Check localStorage for token
  if (GH_TOKEN) {
    const data = await ghFetch();
    if (data) {
      STATE = data;
      try { localStorage.setItem(LS_CACHE_KEY, JSON.stringify(STATE)); } catch(e){}
      render();
      return;
    }
  }
  
  // 2. Try to fetch encrypted token from public repo and decrypt with password
  const encrypted = await fetchEncryptedToken();
  if (encrypted && TEAM_PASSWORD) {
    const token = await decryptToken(encrypted, TEAM_PASSWORD);
    if (token) {
      GH_TOKEN = token;
      localStorage.setItem(LS_TOKEN_KEY, token);
      const data = await ghFetch();
      if (data) {
        STATE = data;
        try { localStorage.setItem(LS_CACHE_KEY, JSON.stringify(STATE)); } catch(e){}
        render();
        return;
      }
    }
  }
  
  // 3. Try cache
  try {
    const cached = localStorage.getItem(LS_CACHE_KEY);
    if (cached) { STATE = JSON.parse(cached); render(); setSyncStatus('offline','キャッシュ'); return; }
  } catch(e){}
  
  // 4. No token anywhere - show admin setup
  showAdminSetup();
}

function showAdminSetup(errMsg) {
  document.getElementById('setupOverlay').innerHTML = '<div class="setup-overlay">' +
    '<div class="token-setup-box">' +
    '<h3>管理者セットアップ</h3>' +
    '<p>初回のみ：GitHubアクセスキーを<br>設定してください。<br><small style="color:#999">設定後、チームメンバーはパスワードだけで利用できます。</small></p>' +
    (errMsg ? '<div class="setup-err" style="display:block">' + errMsg + '</div>' : '') +
    '<input type="text" id="tokenInput" placeholder="ghp_xxxx... を貼り付け">' +
    '<button class="setup-btn" onclick="adminConnect()">設定して接続</button>' +
    '</div></div>';
}

async function adminConnect() {
  const token = document.getElementById('tokenInput').value.trim();
  if (!token) return;
  GH_TOKEN = token;
  localStorage.setItem(LS_TOKEN_KEY, token);
  document.getElementById('setupOverlay').innerHTML = '<div class="loading-overlay">接続・暗号化中...</div>';
  
  // Test token against private data repo
  const data = await ghFetch();
  if (!data && !GH_SHA) {
    // Token invalid for data repo
    GH_TOKEN = '';
    localStorage.removeItem(LS_TOKEN_KEY);
    showAdminSetup('接続できませんでした。アクセスキーを確認してください。');
    return;
  }
  
  // Encrypt token with team password
  let encrypted = '';
  if (TEAM_PASSWORD) {
    encrypted = await encryptToken(token, TEAM_PASSWORD);
    // Try to save to public repo
    const saved = await saveEncryptedToken(encrypted, token);
    if (saved) {
      console.log('Encrypted token saved to public repo successfully');
    } else {
      // Save failed - store encrypted string for manual upload
      console.log('Auto-save failed, encrypted token stored in window._encToken');
      window._encToken = encrypted;
    }
  }

  if (data) {
    STATE = data;
    try { localStorage.setItem(LS_CACHE_KEY, JSON.stringify(STATE)); } catch(e){}
  } else {
    STATE = JSON.parse(JSON.stringify(DEFAULT_DATA));
    await ghSave();
  }
  document.getElementById('setupOverlay').innerHTML = '';
  render();
  showToast('接続成功！');
}

const GH_REPO = 'ptmafia/vjp_gogogo';
const GH_FILE = 'recruitment-data.json';
const GH_API = 'https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_FILE;
const LS_TOKEN_KEY = 'vjp_gh_token';
const LS_CACHE_KEY = 'vjp_data_cache';

let GH_TOKEN = localStorage.getItem(LS_TOKEN_KEY) || '';
let GH_SHA = '';

// ===== DEFAULT DATA (deployed) =====
const DEFAULT_DATA = {positions:[],candidates:[],weekly:{},nextPosId:100,nextCandId:100};

// ===== STATE =====
let STATE = null;
let currentTab = 'positions';

let candFilter = {dateRange:'all',search:'',position:'all'};

// ===== GITHUB SYNC =====
function setSyncStatus(type, text) {
  const el = document.getElementById('syncStatus');
  el.className = 'sync-status sync-' + type;
  el.textContent = text;
}

function utf8ToBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}
function base64ToUtf8(b64) {
  return decodeURIComponent(escape(atob(b64)));
}

async function ghFetch() {
  if (!GH_TOKEN) return null;
  setSyncStatus('saving', '同期中...');
  try {
    const res = await fetch(GH_API, {
      headers: {'Authorization': 'token ' + GH_TOKEN, 'Accept': 'application/vnd.github.v3+json'}
    });
    if (res.status === 404) { setSyncStatus('ok', '新規作成待ち'); return null; }
    if (res.status === 401 || res.status === 403) { setSyncStatus('err', 'Token無効'); return null; }
    if (!res.ok) { setSyncStatus('err', 'エラー'); return null; }
    const data = await res.json();
    GH_SHA = data.sha;
    const content = base64ToUtf8(data.content.replace(/\n/g, ''));
    setSyncStatus('ok', '同期済み ✓');
    return JSON.parse(content);
  } catch(e) {
    setSyncStatus('err', '接続エラー');
    return null;
  }
}

async function ghSave() {
  if (!GH_TOKEN || !STATE) return false;
  setSyncStatus('saving', '保存中...');
  try {
    const content = utf8ToBase64(JSON.stringify(STATE, null, 2));
    const body = {
      message: 'Update recruitment data - ' + new Date().toISOString().split('T')[0],
      content: content
    };
    if (GH_SHA) body.sha = GH_SHA;
    const res = await fetch(GH_API, {
      method: 'PUT',
      headers: {'Authorization': 'token ' + GH_TOKEN, 'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    if (res.status === 409) {
      setSyncStatus('err', '競合発生');
      if (confirm('他の人が先に更新しました。最新データを取得しますか？')) {
        await syncFromGitHub();
      }
      return false;
    }
    if (res.ok) {
      const data = await res.json();
      GH_SHA = data.content.sha;
      // Also cache locally
      try { localStorage.setItem(LS_CACHE_KEY, JSON.stringify(STATE)); } catch(e){}
      setSyncStatus('ok', '保存済み ✓');
      return true;
    }
    setSyncStatus('err', '保存失敗');
    return false;
  } catch(e) {
    setSyncStatus('err', '接続エラー');
    return false;
  }
}

async function syncFromGitHub() {
  const data = await ghFetch();
  if (data) {
    STATE = data;
    try { localStorage.setItem(LS_CACHE_KEY, JSON.stringify(STATE)); } catch(e){}
    render();
    showToast('最新データを取得しました');
  } else if (!STATE) {
    // No remote data and no local state - use defaults
    STATE = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
}

async function connectGitHub() {
  const token = document.getElementById('tokenInput').value.trim();
  if (!token) return;
  GH_TOKEN = token;
  localStorage.setItem(LS_TOKEN_KEY, token);
  document.getElementById('setupOverlay').innerHTML = '<div class="loading-overlay">GitHub に接続中...</div>';
  const data = await ghFetch();
  if (data) {
    STATE = data;
    try { localStorage.setItem(LS_CACHE_KEY, JSON.stringify(STATE)); } catch(e){}
    document.getElementById('setupOverlay').innerHTML = '';
    render();
    showToast('GitHub接続成功！');
  } else if (GH_SHA === '' && GH_TOKEN) {
    // File doesn't exist yet - create it
    STATE = JSON.parse(JSON.stringify(DEFAULT_DATA));
    const ok = await ghSave();
    document.getElementById('setupOverlay').innerHTML = '';
    if (ok) {
      render();
      showToast('GitHub接続成功！初期データを作成しました');
    } else {
      showSetupDialog('接続できませんでした。Tokenを確認してください。');
    }
  } else {
    showSetupDialog('接続できませんでした。Tokenを確認してください。');
  }
}

function useOffline() {
  GH_TOKEN = '';
  localStorage.removeItem(LS_TOKEN_KEY);
  // Load from cache or defaults
  try {
    const cached = localStorage.getItem(LS_CACHE_KEY);
    STATE = cached ? JSON.parse(cached) : JSON.parse(JSON.stringify(DEFAULT_DATA));
  } catch(e) {
    STATE = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  document.getElementById('setupOverlay').innerHTML = '';
  setSyncStatus('offline', 'オフライン');
  render();
}

  }
  // Show login screen, hide dashboard
  document.getElementById('loginOverlay').style.display = 'flex';

  if (GH_TOKEN) {

      STATE = data;
      try { localStorage.setItem(LS_CACHE_KEY, JSON.stringify(STATE)); } catch(e){}
      render();
    } else {
      // Try cache
      try {
        const cached = localStorage.getItem(LS_CACHE_KEY);
        if (cached) { STATE = JSON.parse(cached); render(); }
        else { STATE = JSON.parse(JSON.stringify(DEFAULT_DATA)); render(); }

function renderCandidates() {
  var now = new Date();
  var filtered = STATE.candidates.filter(function(c) {
    if (candFilter.search && !c.name.toLowerCase().includes(candFilter.search.toLowerCase()) && !(c.position||'').toLowerCase().includes(candFilter.search.toLowerCase())) return false;
    if (candFilter.position !== 'all' && c.position !== candFilter.position) return false;
    if (candFilter.dateRange !== 'all') {
      var created = new Date(c.createdAt);
      var days = (now - created) / 86400000;
      var limit = {m1:30,m3:90,m6:180}[candFilter.dateRange];
      if (limit && days > limit) return false;
    }
    return true;
  });
  var positions = []; STATE.candidates.forEach(function(c){if(c.position && !positions.includes(c.position)) positions.push(c.position);}); positions.sort();
  var columns = [{key:'選考中',statuses:['書類選考','一次面接','二次面接']},{key:'内定・入社',statuses:['内定承諾','已入社']},{key:'見送り・辞退',statuses:['見送り','辞退']}];
  var html = '<div class="filter-bar"><label>期間:</label>';
  [{k:'all',l:'全期間'},{k:'m1',l:'1ヶ月'},{k:'m3',l:'3ヶ月'},{k:'m6',l:'半年'}].forEach(function(f){
    html+='<button class="btn '+(candFilter.dateRange===f.k?'active':'')+'" onclick="candFilter.dateRange=\''+f.k+'\';render()">'+f.l+'</button>';

      if (col.key==='内定・入社') return !isRejected && col.statuses.includes(c.status);
      if (col.key==='選考中') return !isRejected && !['内定承諾','已入社'].includes(c.status) && c.status;
      return col.statuses.includes(c.status);

var FUNNEL_FIELDS = ['応募数','SC通過','SC不合格','一面実施','一面通過','一面不合格','二面実施','二面通過','二面不合格','オファー','内定承諾','辞退'];

function getWeekKey(offset) {
  var d = new Date(); d.setDate(d.getDate() + offset * 7);
  var tmp = new Date(d.valueOf()); tmp.setDate(tmp.getDate() + 3 - (tmp.getDay() + 6) % 7);
  var week1 = new Date(tmp.getFullYear(), 0, 4);
  var weekNum = 1 + Math.round(((tmp - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
  return tmp.getFullYear() + '-W' + String(weekNum).padStart(2,'0');
}
function getWeekDates(wk) {
  var parts = wk.split('-W'), y = parseInt(parts[0]), w = parseInt(parts[1]);
  var jan4 = new Date(y, 0, 4), dow = jan4.getDay() || 7;
  var mon = new Date(jan4); mon.setDate(jan4.getDate() - dow + 1 + (w - 1) * 7);
  var sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  return (mon.getMonth()+1)+'/'+mon.getDate()+' ～ '+(sun.getMonth()+1)+'/'+sun.getDate();
}

function renderFunnel() {
  var weekKey = getWeekKey(funnelWeekOffset), weekDates = getWeekDates(weekKey);
  var weekData = STATE.weekly[weekKey] || {};
  var openPos = STATE.positions.filter(function(p){return p.status!=='CLOSE'}).sort(function(a,b){var po={HIGH:0,MID:1,LOW:2};return (po[a.priority]||9)-(po[b.priority]||9);});
  var totals = {}; FUNNEL_FIELDS.forEach(function(f){totals[f]=0;});
  Object.values(weekData).forEach(function(row){FUNNEL_FIELDS.forEach(function(f){totals[f]+=(row[f]||0);});});
  var html = '<div class="funnel-header"><h3>週次採用ファネル</h3><div class="week-nav"><button onclick="funnelWeekOffset--;render()">◀</button><div class="week-label">'+weekKey+'<br><span style="font-size:11px;color:var(--sub)">'+weekDates+'</span></div><button onclick="funnelWeekOffset++;render()">▶</button><button onclick="funnelWeekOffset=0;render()" style="margin-left:8px;font-size:11px">今週</button></div><div>';
  html += funnelEditing ? '<button class="add-btn" onclick="saveFunnelData(\''+weekKey+'\')">💾 保存</button><button class="btn-secondary" style="margin-left:4px" onclick="funnelEditing=false;render()">キャンセル</button>' : '<button class="add-btn" onclick="funnelEditing=true;render()">✏️ 編集</button>';
  html += '</div></div><table class="funnel-table"><thead><tr><th>ポジション</th>';
  FUNNEL_FIELDS.forEach(function(f){html+='<th>'+esc(f)+'</th>';});
  html += '<th>備考</th></tr></thead><tbody><tr class="subtotal"><td>合計</td>';
  FUNNEL_FIELDS.forEach(function(f){html+='<td>'+(totals[f]||'')+'</td>';});
  html += '<td></td></tr>';
  openPos.forEach(function(p){
    var row = weekData[p.name] || {};
    html += '<tr><td>'+esc(p.name)+'</td>';
    if (funnelEditing) {
      FUNNEL_FIELDS.forEach(function(f){html+='<td><input type="number" min="0" value="'+(row[f]||'')+'" data-pos="'+esc(p.name)+'" data-field="'+esc(f)+'"></td>';});
      html += '<td><input type="text" value="'+esc(row.memo||'')+'" data-pos="'+esc(p.name)+'" data-field="memo" style="width:100px"></td>';
    } else {
      FUNNEL_FIELDS.forEach(function(f){html+='<td>'+(row[f]||'')+'</td>';});
      html += '<td>'+esc(row.memo||'')+'</td>';
    }
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('content').innerHTML = html;
}

async function saveFunnelData(weekKey) {
  if (!STATE.weekly[weekKey]) STATE.weekly[weekKey] = {};
  document.querySelectorAll('.funnel-table input').forEach(function(inp){
    var pos=inp.dataset.pos, field=inp.dataset.field;
    if (!pos||!field) return;
    if (!STATE.weekly[weekKey][pos]) STATE.weekly[weekKey][pos]={};
    STATE.weekly[weekKey][pos][field] = field==='memo' ? inp.value : (parseInt(inp.value)||0);
  });
  funnelEditing = false;
  await saveAndSync();
  showToast('保存しました');

// ===== HELPERS =====
function positionSelectHtml(selected) {
  var opts = '<option value="">-- 選択 --</option>';
  var openPos = STATE.positions.filter(function(p){return p.status!=='CLOSE'}).sort(function(a,b){return (a.dept||'').localeCompare(b.dept||'');});
  var closedPos = STATE.positions.filter(function(p){return p.status==='CLOSE'});
  if (openPos.length) {
    opts += '<optgroup label="募集中">';
    openPos.forEach(function(p){opts+='<option value="'+esc(p.name)+'" '+(selected===p.name?'selected':'')+'>'+esc(p.name)+(p.dept?' ('+esc(p.dept)+')':'')+'</option>';});
    opts += '</optgroup>';
  }
  if (closedPos.length) {
    opts += '<optgroup label="クローズ">';
    closedPos.forEach(function(p){opts+='<option value="'+esc(p.name)+'" '+(selected===p.name?'selected':'')+'>'+esc(p.name)+'</option>';});
    opts += '</optgroup>';
  }
  return '<select name="position">'+opts+'</select>';
}

function handleResumeUpload(inputEl) {
  var file = inputEl.files[0]; if (!file) return;
  if (file.size > 5*1024*1024) { alert('ファイルサイズは5MB以下にしてください'); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    var container = inputEl.closest('.field');
    container.querySelector('.resume-data').value = e.target.result;
    container.querySelector('.resume-name-val').value = file.name;
    var preview = container.querySelector('.resume-preview');
    preview.innerHTML = '<span class="resume-link">📄 '+esc(file.name)+' <span style="color:var(--sub);font-size:11px">'+(file.size/1024).toFixed(0)+'KB</span></span>';
    preview.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function resumeFieldHtml(resumeData, resumeName) {
  var hasResume = resumeData && resumeName;
  return '<div class="field"><label>履歴書・職務経歴書</label>'+
    '<input type="hidden" class="resume-data" name="resumeData" value="'+(resumeData?'HAS_DATA':'')+'">'+
    '<input type="hidden" class="resume-name-val" name="resumeName" value="'+esc(resumeName||'')+'">'+
    '<div class="resume-preview" style="display:'+(hasResume?'block':'none')+';margin-bottom:8px">'+(hasResume?'<span class="resume-link">📄 '+esc(resumeName)+'</span>':'')+'</div>'+
    '<div class="resume-upload" onclick="this.querySelector(\'input\').click()">'+
    '<input type="file" accept=".pdf,.doc,.docx,.txt" style="display:none" onchange="handleResumeUpload(this)">'+
    '<div style="color:var(--sub);font-size:13px">'+(hasResume?'📎 ファイルを変更':'📎 ファイルをアップロード')+'</div>'+
    '<div style="color:#c7c7cc;font-size:11px;margin-top:4px">PDF, Word, テキスト（5MB以下）</div>'+
    '</div></div>';
}

// ===== CRUD =====
async function savePosition(e, id) {
  e.preventDefault(); var f=e.target;
  var p = STATE.positions.find(function(x){return x.id===id;}); if(!p) return;
  p.name=f.name.value;p.status=f.status.value;p.priority=f.priority.value;p.dept=f.dept.value;p.salary=f.salary.value;p.headcount=f.headcount.value;p.nationality=f.nationality.value;p.base=f.base.value;p.channels=f.channels.value;p.jd=f.jd.value;p.requirements=f.requirements.value;p.jobLink=f.jobLink.value;p.memo=f.memo.value;p.updatedAt=new Date().toISOString().split('T')[0];
  closeModal(); await saveAndSync(); showToast('ポジション更新しました');
}
async function addPosition(e) {
  e.preventDefault(); var f=e.target;
  STATE.positions.push({id:'p'+(STATE.nextPosId++),name:f.name.value,status:f.status.value,priority:f.priority.value,dept:f.dept.value,salary:f.salary.value,headcount:f.headcount.value,nationality:f.nationality.value,base:f.base.value,channels:f.channels.value,jd:f.jd.value,requirements:f.requirements.value,jobLink:f.jobLink.value,memo:f.memo.value,updatedAt:new Date().toISOString().split('T')[0]});
  closeModal(); await saveAndSync(); showToast('ポジション追加しました');
}
async function deletePosition(id) {
  if (!confirm('本当に削除しますか？')) return;
  STATE.positions=STATE.positions.filter(function(x){return x.id!==id;});
  closeModal(); await saveAndSync(); showToast('削除しました');
}
async function saveCandidate(e, id) {
  e.preventDefault(); var f=e.target;
  var c = STATE.candidates.find(function(x){return x.id===id;}); if(!c) return;
  c.name=f.name.value;c.position=f.position.value;c.status=f.status.value;c.judgment=f.judgment.value;c.age=f.age.value?parseInt(f.age.value):null;c.location=f.location.value;c.japanese=f.japanese.value;c.english=f.english.value;c.salary=f.salary.value;
  var rd=f.resumeData.value; if(rd&&rd!=='HAS_DATA'){c.resumeData=rd;c.resumeName=f.resumeName.value;} else if(!rd){c.resumeData='';c.resumeName='';}
  c.coreExp=f.coreExp.value;c.interviewEval=f.interviewEval.value;c.coreRisk=f.coreRisk.value;c.reason=f.reason.value;
  closeModal(); await saveAndSync(); showToast('候補者更新しました');
}
async function addCandidate(e) {
  e.preventDefault(); var f=e.target;
  var newCand = {id:'c'+(STATE.nextCandId++),name:f.name.value,position:f.position.value,status:f.status.value,judgment:f.judgment.value,age:f.age.value?parseInt(f.age.value):null,location:f.location.value,japanese:f.japanese.value,english:f.english.value,salary:f.salary.value,coreExp:f.coreExp.value,interviewEval:f.interviewEval.value,coreRisk:f.coreRisk.value,reason:f.reason.value,createdAt:new Date().toISOString().split('T')[0]};
  var rd=f.resumeData.value; if(rd&&rd!=='HAS_DATA'){newCand.resumeData=rd;newCand.resumeName=f.resumeName.value;}
  STATE.candidates.push(newCand);
  closeModal(); await saveAndSync(); showToast('候補者追加しました');
}
async function deleteCandidate(id) {
  if (!confirm('本当に削除しますか？')) return;
  STATE.candidates=STATE.candidates.filter(function(x){return x.id!==id;});
  closeModal(); await saveAndSync(); showToast('削除しました');
}

// ===== EXPORT / IMPORT =====
function exportData() {
  var blob = new Blob([JSON.stringify(STATE,null,2)],{type:'application/json'});
  var a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='VJP採用データ_'+new Date().toISOString().split('T')[0]+'.json'; a.click();
  showToast('エクスポートしました');
}
async function importData(e) {
  var file = e.target.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = async function(ev) {
    try {
      var data = JSON.parse(ev.target.result);
      if (data.positions && data.candidates) {
        STATE = data;
        await saveAndSync();
        showToast('インポートしました');
      } else { alert('無効なデータ形式です'); }
    } catch(err) { alert('ファイル読み込みエラー: '+err.message); }
  };
  reader.readAsText(file); e.target.value = '';
}

// ===== UTILS =====
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(function(){t.style.display='none';},2500);}

// ===== START =====
init();
</script>
