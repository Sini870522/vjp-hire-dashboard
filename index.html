<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VJP 採用ダッシュボード</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f6f5f3;--card:#fff;--border:#e6e3df;--text:#2c2825;--sub:#8a8580;--accent:#6b5c4f;--accent-light:#f0ece8;--open:#5a9a6e;--close:#c75c5c;--hold:#c49545;--high:#c75c5c;--mid:#c49545;--low:#8a8580;--hire:#5a9a6e;--reject:#c75c5c;--shadow:0 1px 3px rgba(44,40,37,.06);--shadow-md:0 4px 16px rgba(44,40,37,.1);--radius:10px;--font:'Inter','Noto Sans JP',-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.6;letter-spacing:.01em;-webkit-font-smoothing:antialiased}
.header{background:#2c2825;color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.header h1{font-size:17px;font-weight:500;letter-spacing:1.5px}
.header .meta{font-size:11.5px;color:rgba(255,255,255,.45);letter-spacing:.4px;margin-top:2px}
.header .actions{display:flex;gap:6px;align-items:center}
.header .actions button{background:rgba(255,255,255,.08);color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.1);padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer;font-family:var(--font);letter-spacing:.3px;transition:all .2s}
.header .actions button:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.2)}
.sync-status{font-size:11px;padding:4px 12px;border-radius:20px;display:inline-block;font-weight:500;letter-spacing:.3px}
.sync-ok{background:rgba(90,154,110,.12);color:#5a9a6e;border:1px solid rgba(90,154,110,.18)}
.sync-saving{background:rgba(196,149,69,.12);color:#c49545;border:1px solid rgba(196,149,69,.18)}
.sync-err{background:rgba(199,92,92,.12);color:#c75c5c;border:1px solid rgba(199,92,92,.18)}
.sync-offline{background:rgba(138,133,128,.12);color:#8a8580;border:1px solid rgba(138,133,128,.18)}
.stats{display:flex;gap:6px;padding:20px 28px;background:#fff;border-bottom:1px solid var(--border)}
.stat{text-align:center;padding:10px 20px;min-width:100px;border-radius:10px;transition:.2s}
.stat:hover{background:var(--bg)}
.stat .num{font-size:26px;font-weight:700;letter-spacing:-.5px}
.stat .lbl{font-size:11px;color:var(--sub);margin-top:3px;letter-spacing:.5px;text-transform:uppercase;font-weight:500}
.tabs{display:flex;gap:0;background:#fff;border-bottom:1px solid var(--border);padding:0 28px}
.tab{padding:14px 22px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2.5px solid transparent;color:var(--sub);transition:all .2s;letter-spacing:.3px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.content{padding:24px 28px;max-width:1440px;margin:0 auto}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
thead{background:#f5f3f0}
th{padding:11px 14px;text-align:left;font-size:11.5px;font-weight:600;color:var(--sub);border-bottom:1px solid var(--border);white-space:nowrap;letter-spacing:.5px;text-transform:uppercase}
td{padding:12px 14px;border-bottom:1px solid #f3f4f6;font-size:13px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#374151}
tr:hover{background:#f9fafb}
tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px}
.badge-open{background:#e8f0eb;color:#3d7a52}
.badge-close{background:#f5e4e4;color:#a14545}
.badge-hold{background:#f3ecdf;color:#8c6e30}
.badge-unpub{background:#eeece9;color:#7a756f}
.pri-high{color:var(--high);font-weight:700}
.pri-mid{color:var(--mid);font-weight:600}
.pri-low{color:var(--low)}
.filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-bar label{font-size:12px;color:var(--sub);margin-right:2px;font-weight:500;letter-spacing:.3px}
.filter-bar select,.filter-bar input{padding:7px 12px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;background:#fff;font-family:var(--font);color:var(--text);transition:border .2s}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-light)}
.filter-bar .btn{padding:7px 14px;border:1px solid var(--border);border-radius:8px;font-size:12px;cursor:pointer;background:#fff;font-family:var(--font);transition:all .2s;font-weight:500}
.filter-bar .btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-bar .btn:hover{border-color:var(--accent);color:var(--accent)}
.filter-bar .btn.active:hover{color:#fff}
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.kanban-col{min-width:240px;max-width:300px;flex:1;background:#edecea;border-radius:12px;padding:14px}
.kanban-col h3{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:12px;display:flex;justify-content:space-between;letter-spacing:.5px;text-transform:uppercase}
.kanban-col h3 .cnt{background:var(--accent);color:#fff;border-radius:12px;padding:1px 9px;font-size:11px;font-weight:600}
.cand-card{background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;transition:all .2s;border:1px solid transparent}
.cand-card:hover{box-shadow:var(--shadow-md);border-color:var(--accent);transform:translateY(-1px)}
.cand-card .name{font-weight:600;font-size:13.5px;color:var(--text)}
.cand-card .pos{font-size:11.5px;color:var(--sub);margin-top:3px;letter-spacing:.2px}
.cand-card .date{font-size:10.5px;color:var(--sub);margin-top:5px}
.cand-card.stale{opacity:.5}
.cand-card.stale .date{color:var(--close)}
.cand-card .judgment{font-size:11px;margin-top:5px}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(44,40,37,.45);backdrop-filter:blur(4px);z-index:100;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;max-width:720px;width:92%;max-height:85vh;overflow-y:auto;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal h2{font-size:18px;font-weight:700;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;letter-spacing:.2px}
.modal .close-btn{background:#edecea;border:none;font-size:18px;cursor:pointer;color:var(--sub);padding:6px 10px;border-radius:8px;transition:.2s}
.modal .close-btn:hover{background:#e2dfdb}
.modal .field{margin-bottom:14px}
.modal .field label{display:block;font-size:11.5px;font-weight:600;color:var(--sub);margin-bottom:5px;letter-spacing:.5px;text-transform:uppercase}
.modal .field input,.modal .field select,.modal .field textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13.5px;font-family:var(--font);color:var(--text);transition:border .2s}
.modal .field input:focus,.modal .field select:focus,.modal .field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-light)}
.modal .field textarea{min-height:70px;resize:vertical;line-height:1.7}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal .btn-primary{background:var(--accent);color:#fff;border:none;padding:11px 24px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--font);letter-spacing:.3px;transition:all .2s}
.modal .btn-primary:hover{background:#584a3e;transform:translateY(-1px);box-shadow:0 4px 12px rgba(107,92,79,.25)}
.modal .btn-danger{background:#f8eded;color:var(--close);border:1px solid #e8cccc;padding:9px 18px;border-radius:8px;font-size:12.5px;cursor:pointer;font-family:var(--font);font-weight:500;transition:.2s}
.modal .btn-danger:hover{background:#fee2e2}
.modal .btn-secondary{background:#edecea;color:var(--text);border:none;padding:9px 18px;border-radius:8px;font-size:12.5px;cursor:pointer;font-family:var(--font);font-weight:500;transition:.2s}
.modal .btn-secondary:hover{background:#e2dfdb}
.modal .detail-section{margin-bottom:18px}
.modal .detail-section h4{font-size:11.5px;font-weight:600;color:var(--sub);margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
.modal .detail-section p{font-size:13.5px;line-height:1.7;white-space:pre-wrap;color:#374151}
.modal .detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:8px}
.modal .detail-item{background:#f5f3f0;padding:10px 12px;border-radius:8px}
.modal .detail-item .di-label{font-size:10.5px;color:var(--sub);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.modal .detail-item .di-value{font-size:13.5px;margin-top:3px;font-weight:500}
.funnel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.funnel-header h3{font-size:16px;font-weight:600;letter-spacing:.2px}
.week-nav{display:flex;align-items:center;gap:8px}
.week-nav button{background:#edecea;border:1px solid var(--border);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-family:var(--font);transition:.2s}
.week-nav button:hover{background:#e2dfdb}
.week-nav .week-label{font-size:13px;font-weight:600;min-width:200px;text-align:center}
.funnel-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.funnel-table th{background:#f5f3f0;padding:10px 12px;font-size:11px;text-align:center;border:1px solid var(--border);letter-spacing:.3px;font-weight:600}
.funnel-table td{padding:8px 10px;text-align:center;font-size:12.5px;border:1px solid #f3f4f6}
.funnel-table td:first-child{text-align:left;font-weight:500;min-width:150px}
.funnel-table input[type=number]{width:52px;padding:5px;border:1.5px solid var(--border);border-radius:6px;text-align:center;font-size:12px;font-family:var(--font)}
.funnel-table .subtotal{font-weight:700;background:#f5f3f0}
.add-btn{background:var(--accent);color:#fff;border:none;padding:8px 18px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:var(--font);letter-spacing:.3px;transition:all .2s}
.add-btn:hover{background:#584a3e;transform:translateY(-1px);box-shadow:0 4px 12px rgba(107,92,79,.2)}
.clickable{cursor:pointer;color:var(--accent);font-weight:500}
.clickable:hover{text-decoration:underline}
.biz-columns{display:flex;flex-direction:column;gap:24px}
.biz-block{background:var(--card);border-radius:12px;padding:20px;box-shadow:var(--shadow);overflow-x:auto}
.biz-block-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--border)}
.biz-block-header h2{font-size:15px;font-weight:700;letter-spacing:.5px;color:var(--text)}
.biz-block-header .biz-count{background:var(--accent-light);color:var(--accent);font-size:11px;padding:2px 10px;border-radius:20px;font-weight:600}
.dept-divider td{background:#f5f3f0;padding:8px 14px !important;border-bottom:1px solid var(--border) !important;font-size:12px}
.dept-divider-name{font-weight:700;color:var(--text);margin-right:8px;letter-spacing:.3px}
.dept-group{margin-bottom:24px}
.dept-group-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:4px 0}
.dept-group-header h3{font-size:14px;font-weight:700;color:var(--text);letter-spacing:.3px}
.dept-group-header .dept-count{background:var(--accent-light);color:var(--accent);font-size:11px;padding:2px 10px;border-radius:20px;font-weight:600;letter-spacing:.3px}
.dept-group-header .dept-open{background:#e8f0eb;color:#3d7a52;font-size:11px;padding:2px 10px;border-radius:20px;font-weight:600;letter-spacing:.3px}
.jd-content{background:#f5f3f0;border-radius:10px;padding:18px;font-size:13.5px;line-height:1.8;white-space:pre-wrap;border-left:3px solid var(--accent);color:#4a453f}
.resume-upload{border:2px dashed #d1d5db;border-radius:10px;padding:18px;text-align:center;cursor:pointer;transition:all .2s;background:#fafbfc}
.resume-upload:hover{border-color:var(--accent);background:var(--accent-light)}
.resume-link{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:var(--accent-light);border-radius:8px;font-size:13px;color:var(--accent);text-decoration:none;font-weight:500;transition:.2s}
.resume-link:hover{background:#e4dfd9}
.toggle-wrap{display:flex;align-items:center;gap:7px;margin-left:auto}
.toggle-label{font-size:12px;color:var(--sub);font-weight:500;letter-spacing:.3px;cursor:pointer;user-select:none}
.toggle{position:relative;width:36px;height:20px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--border);border-radius:20px;transition:.25s}
.toggle .slider:before{content:'';position:absolute;width:16px;height:16px;left:2px;bottom:2px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.toggle input:checked+.slider{background:var(--accent)}
.toggle input:checked+.slider:before{transform:translateX(16px)}
.view-toggle{display:flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.view-toggle button{padding:6px 16px;font-size:12px;border:none;background:#fff;color:var(--sub);cursor:pointer;font-family:var(--font);font-weight:500;transition:all .2s}
.view-toggle button.active{background:var(--accent);color:#fff}
.view-toggle button:not(:last-child){border-right:1px solid var(--border)}
.stage-summary{display:flex;gap:6px;flex-wrap:wrap;padding:12px 0}
.stage-pill{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500;background:var(--accent-light);color:var(--accent)}
.stage-pill b{font-size:14px}
.stage-pill.zero{opacity:.4}
.pos-group{margin-bottom:16px}
.pos-group-header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--accent-light);border-radius:10px;margin-bottom:8px;cursor:pointer}
.pos-group-header:hover{background:#e4dfd9}
.pos-group-header h4{font-size:13px;font-weight:600;margin:0;flex:1}
.pos-group-header .pos-total{font-size:12px;color:var(--accent);font-weight:700}
.pos-stages{display:flex;gap:4px;flex-wrap:wrap}
.pos-stage-tag{font-size:11px;padding:2px 8px;border-radius:12px;background:#fff;border:1px solid var(--border);color:var(--text)}
.pos-stage-tag b{color:var(--accent);margin-left:2px}
.pipe-count{font-weight:700;color:var(--accent);cursor:pointer;padding:2px 8px;border-radius:12px;background:var(--accent-light);font-size:12px}
.pipe-count:hover{background:#e4dfd9}
.pipe-detail{position:absolute;z-index:10;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-md);padding:6px 0;margin-top:4px;min-width:140px}
.pipe-stage{display:block;padding:5px 14px;font-size:12px;color:var(--text);cursor:pointer;text-decoration:none;white-space:nowrap}
.pipe-stage:hover{background:var(--accent-light)}
.pipe-stage b{color:var(--accent);margin-left:2px}
td{position:relative}
.ms-wrap{position:relative}
.ms-selected{display:flex;flex-wrap:wrap;gap:4px;min-height:36px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:#fff;align-items:center;transition:border-color .2s}
.ms-selected:hover{border-color:var(--accent)}
.ms-selected.open{border-color:var(--accent);box-shadow:0 0 0 2px rgba(107,92,79,.12)}
.ms-tag{display:inline-flex;align-items:center;gap:3px;background:var(--accent-light);color:var(--accent);padding:2px 8px;border-radius:12px;font-size:11.5px;font-weight:500;white-space:nowrap}
.ms-tag .ms-rm{cursor:pointer;font-size:13px;line-height:1;opacity:.6;margin-left:2px}
.ms-tag .ms-rm:hover{opacity:1}
.ms-ph{color:var(--sub);font-size:12.5px}
.ms-dd{position:absolute;top:100%;left:0;right:0;z-index:20;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-md);margin-top:4px;max-height:200px;overflow-y:auto;display:none}
.ms-dd.show{display:block}
.ms-opt{padding:7px 12px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s}
.ms-opt:hover{background:var(--accent-light)}
.ms-opt.sel{color:var(--accent);font-weight:600}
.ms-opt .ms-chk{width:14px;height:14px;border:1.5px solid var(--border);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;transition:all .15s}
.ms-opt.sel .ms-chk{background:var(--accent);border-color:var(--accent);color:#fff}
.ms-input-row{padding:6px 8px;border-bottom:1px solid var(--border)}
.ms-input-row input{width:100%;border:none;outline:none;font-size:12px;font-family:var(--font);padding:2px 0}
.toast{position:fixed;bottom:24px;right:24px;background:#2c2825;color:#fff;padding:14px 24px;border-radius:12px;font-size:13.5px;z-index:200;display:none;animation:fadeIn .3s;box-shadow:0 8px 24px rgba(0,0,0,.15);font-weight:500;letter-spacing:.2px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
/* Setup dialog */
.setup-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(44,40,37,.6);backdrop-filter:blur(4px);z-index:300;display:flex;justify-content:center;align-items:center}
.setup-box{background:#fff;border-radius:20px;max-width:520px;width:90%;padding:36px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.setup-box h2{font-size:20px;margin-bottom:10px;font-weight:700;letter-spacing:.2px}
.setup-box p{font-size:13.5px;color:var(--sub);margin-bottom:18px;line-height:1.7}
.setup-box .steps{background:#f8f9fb;border-radius:10px;padding:18px;margin-bottom:18px;font-size:13px;line-height:1.9}
.setup-box .steps a{color:var(--accent)}
.setup-box input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;margin-bottom:14px;font-family:var(--font);transition:border .2s}
.setup-box input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-light)}
.setup-box button{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .2s}
.setup-box button:hover{background:#584a3e}
.setup-box .err{color:var(--close);font-size:12px;margin-bottom:8px;display:none}
.setup-box .skip{text-align:center;margin-top:14px;font-size:12.5px;color:var(--sub)}
.setup-box .skip a{color:var(--accent);cursor:pointer}
.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(4px);z-index:250;display:flex;justify-content:center;align-items:center;font-size:15px;color:var(--sub);font-weight:500;letter-spacing:.3px}
@media(max-width:768px){
  .content{padding:16px}
  .kanban{flex-direction:column}
  .kanban-col{max-width:100%;min-width:100%}
  .modal .row{grid-template-columns:1fr}
  .stats{flex-wrap:wrap}
  .header{padding:14px 18px}
}

/* Login screen */
.login-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:#2c2825;z-index:400;display:flex;justify-content:center;align-items:center}
.login-box{background:#fff;border-radius:24px;max-width:380px;width:90%;padding:44px 40px;box-shadow:0 24px 80px rgba(0,0,0,.25);text-align:center}
.login-box .logo{font-size:20px;font-weight:600;letter-spacing:4px;margin-bottom:6px;color:#2c2825}
.login-box .subtitle{font-size:12.5px;color:var(--sub);margin-bottom:36px;letter-spacing:.5px;font-weight:400}
.login-box input{width:100%;padding:14px 18px;border:1.5px solid var(--border);border-radius:12px;font-size:15px;text-align:center;margin-bottom:18px;outline:none;transition:all .2s;font-family:var(--font);letter-spacing:1px}
.login-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.login-box input::placeholder{color:#c7c7cc;letter-spacing:.5px}
.login-box .login-btn{width:100%;padding:14px;background:#2c2825;color:#fff;border:none;border-radius:12px;font-size:14.5px;font-weight:600;cursor:pointer;transition:all .2s;font-family:var(--font);letter-spacing:.5px}

<script>
// ===== LOGIN =====
const PW_HASH = '506c92291bb7a59d9c6357184388dd81cd192140516a68220ab93c77f46b5b0e';
const LS_AUTH_KEY = 'vjp_auth';
const GH_TOKEN_FILE = 'token.enc';
let TEAM_PASSWORD = '';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// AES encrypt/decrypt using team password
async function deriveKey(password) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: enc.encode('vjp-salt-2026'), iterations:100000, hash:'SHA-256'},
    keyMaterial, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
  );
}

async function encryptToken(token, password) {
  const key = await deriveKey(password);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const ct = await crypto.subtle.encrypt({name:'AES-GCM',iv}, key, enc.encode(token));
  // Combine iv + ciphertext, base64 encode
  const combined = new Uint8Array(iv.length + ct.byteLength);
  combined.set(iv);
  combined.set(new Uint8Array(ct), iv.length);
  return btoa(String.fromCharCode(...combined));
}

async function decryptToken(encrypted, password) {
  try {
    const key = await deriveKey(password);
    const raw = Uint8Array.from(atob(encrypted), c=>c.charCodeAt(0));
    const iv = raw.slice(0,12);
    const ct = raw.slice(12);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM',iv}, key, ct);
    return new TextDecoder().decode(pt);
  } catch(e) { return null; }
}

// Try to fetch encrypted token from GitHub (public repo - no auth needed)
async function fetchEncryptedToken() {
  try {
    const url = 'https://raw.githubusercontent.com/Sini870522/vjp-hire-dashboard/main/' + GH_TOKEN_FILE + '?t=' + Date.now();
    const res = await fetch(url);
    if (!res.ok) return null;
    return await res.text();
  } catch(e) { return null; }
}

// Save encrypted token to public repo (needs a token with write access to public repo)
async function saveEncryptedToken(encryptedData, writeToken) {
  const url = 'https://api.github.com/repos/Sini870522/vjp-hire-dashboard/contents/' + GH_TOKEN_FILE;
  // Check if file exists to get SHA
  let sha = '';
  try {
    const check = await fetch(url, {headers:{'Authorization':'token '+writeToken,'Accept':'application/vnd.github.v3+json'}});
    if (check.ok) { const d = await check.json(); sha = d.sha; }
  } catch(e){}
  
  const body = {
    message: 'Update encrypted config',
    content: btoa(unescape(encodeURIComponent(encryptedData)))
  };
  if (sha) body.sha = sha;
  const res = await fetch(url, {
    method:'PUT',
    headers:{'Authorization':'token '+writeToken,'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  return res.ok;
}

async function checkLogin() {
  const pw = document.getElementById('loginPassword').value;
  const hash = await sha256(pw);
  if (hash === PW_HASH) {
    TEAM_PASSWORD = pw;
    sessionStorage.setItem(LS_AUTH_KEY, '1');
    sessionStorage.setItem('vjp_pw', pw);
    document.getElementById('loginOverlay').style.display = 'none';
    afterLogin();
  } else {
    const err = document.getElementById('loginErr');
    err.style.display = 'block';
    document.getElementById('loginPassword').value = '';
    document.getElementById('loginPassword').focus();
    setTimeout(()=>{err.style.display='none'}, 3000);
  }
}

function checkAuth() {
  if (sessionStorage.getItem(LS_AUTH_KEY) === '1') {
    TEAM_PASSWORD = sessionStorage.getItem('vjp_pw') || '';
    return true;
  }
  return false;
}

async function afterLogin() {
  document.getElementById('content').innerHTML = '<div class="loading-overlay">データ読み込み中...</div>';
  
  // 1. Check localStorage for token
  if (GH_TOKEN) {
    const data = await ghFetch();
    if (data) {
      STATE = data;
      try { localStorage.setItem(LS_CACHE_KEY, JSON.stringify(STATE)); } catch(e){}
      render();
      return;
    }
  }
  
  // 2. Try to fetch encrypted token from public repo and decrypt with password
  const encrypted = await fetchEncryptedToken();
  if (encrypted && TEAM_PASSWORD) {
    const token = await decryptToken(encrypted, TEAM_PASSWORD);
    if (token) {
      GH_TOKEN = token;
      localStorage.setItem(LS_TOKEN_KEY, token);
      const data = await ghFetch();
      if (data) {
        STATE = data;
        try { localStorage.setItem(LS_CACHE_KEY, JSON.stringify(STATE)); } catch(e){}
        render();
        return;
      }
    }
  }
  
  // 3. Try cache
  try {
    const cached = localStorage.getItem(LS_CACHE_KEY);
    if (cached) { STATE = JSON.parse(cached); render(); setSyncStatus('offline','キャッシュ'); return; }
  } catch(e){}
  
  // 4. No token anywhere - show admin setup
  showAdminSetup();
}

function showAdminSetup(errMsg) {
  document.getElementById('setupOverlay').innerHTML = '<div class="setup-overlay">' +
    '<div class="token-setup-box">' +
    '<h3>管理者セットアップ</h3>' +
    '<p>初回のみ：GitHubアクセスキーを<br>設定してください。<br><small style="color:#999">設定後、チームメンバーはパスワードだけで利用できます。</small></p>' +
    (errMsg ? '<div class="setup-err" style="display:block">' + errMsg + '</div>' : '') +
    '<input type="text" id="tokenInput" placeholder="ghp_xxxx... を貼り付け">' +
    '<button class="setup-btn" onclick="adminConnect()">設定して接続</button>' +
    '</div></div>';
}

async function adminConnect() {
  const token = document.getElementById('tokenInput').value.trim();
  if (!token) return;
  GH_TOKEN = token;
  localStorage.setItem(LS_TOKEN_KEY, token);
  document.getElementById('setupOverlay').innerHTML = '<div class="loading-overlay">接続・暗号化中...</div>';
  
  // Test token against private data repo
  const data = await ghFetch();
  if (!data && !GH_SHA) {
    // Token invalid for data repo
    GH_TOKEN = '';
    localStorage.removeItem(LS_TOKEN_KEY);
    showAdminSetup('接続できませんでした。アクセスキーを確認してください。');
    return;
  }
  
  // Encrypt token with team password
  let encrypted = '';
  if (TEAM_PASSWORD) {
    encrypted = await encryptToken(token, TEAM_PASSWORD);
    // Try to save to public repo
    const saved = await saveEncryptedToken(encrypted, token);
    if (saved) {
      console.log('Encrypted token saved to public repo successfully');
    } else {
      // Save failed - store encrypted string for manual upload
      console.log('Auto-save failed, encrypted token stored in window._encToken');
      window._encToken = encrypted;
    }
  }

  if (data) {
    STATE = data;
    try { localStorage.setItem(LS_CACHE_KEY, JSON.stringify(STATE)); } catch(e){}
  } else {
    STATE = JSON.parse(JSON.stringify(DEFAULT_DATA));
    await ghSave();
  }
  document.getElementById('setupOverlay').innerHTML = '';
  render();
  showToast('接続成功！');
}

function showTokenSetup(errMsg) { showAdminSetup(errMsg); }

// ===== TOKEN SHARING =====
async function shareToken() {
  if (!GH_TOKEN) { showToast('トークン未設定です。先に⚙️で設定してください。'); return; }
  if (!TEAM_PASSWORD) { showToast('パスワード未取得。再ログインしてください。'); return; }
  try {
    var encrypted = await encryptToken(GH_TOKEN, TEAM_PASSWORD);
    var dlg = document.createElement('div');
    dlg.className = 'share-overlay';
    dlg.id = 'shareOverlay';
    dlg.innerHTML = '<div class="share-box">' +
      '<h3>🔗 トークン共有設定</h3>' +
      '<p>以下の暗号化文字列をコピーして<br>管理者（Sini）に送ってください。<br><small style="color:#999">※ この文字列はパスワードなしでは復号できません。安全に共有できます。</small></p>' +
      '<textarea id="shareTokenText" readonly rows="5" style="width:100%;font-size:11px;font-family:monospace;border:1px solid #ddd;border-radius:8px;padding:8px;resize:none;background:#f9f8f6">' + encrypted + '</textarea>' +
      '<div style="display:flex;gap:8px;margin-top:12px">' +
      '<button class="setup-btn" onclick="copyShareToken()" style="flex:1">📋 コピー</button>' +
      '<button class="setup-btn" onclick="document.getElementById(\'shareOverlay\').remove()" style="flex:1;background:#8a8580">閉じる</button>' +
      '</div></div>';
    document.body.appendChild(dlg);
  } catch(e) { showToast('暗号化エラー: ' + e.message); }
}

function copyShareToken() {
  var ta = document.getElementById('shareTokenText');
  ta.select();
  document.execCommand('copy');
  showToast('コピーしました！');
}

// ===== GITHUB CONFIG =====
const GH_REPO = 'ptmafia/vjp_gogogo';
const GH_FILE = 'recruitment-data.json';
const GH_API = 'https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_FILE;
const LS_TOKEN_KEY = 'vjp_gh_token';
const LS_CACHE_KEY = 'vjp_data_cache';

let GH_TOKEN = localStorage.getItem(LS_TOKEN_KEY) || '';
let GH_SHA = '';

// ===== DEFAULT DATA (deployed) =====
const DEFAULT_DATA = {positions:[],candidates:[],weekly:{},nextPosId:100,nextCandId:100};

// ===== STATE =====
let STATE = null;
let currentTab = 'positions';
let posFilter = {status:'all',priority:'all',dept:'all',search:'',showClosed:false};
let candFilter = {dateRange:'year',search:'',position:'',fromDate:'',toDate:''};
let candView = 'status'; // 'status' or 'position'
let funnelWeekOffset = 0;
let funnelEditing = false;

// ===== GITHUB SYNC =====
function setSyncStatus(type, text) {
  const el = document.getElementById('syncStatus');
  el.className = 'sync-status sync-' + type;
  el.textContent = text;
}

function utf8ToBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}
function base64ToUtf8(b64) {
  return decodeURIComponent(escape(atob(b64)));
}

async function ghFetch() {
  if (!GH_TOKEN) return null;
  setSyncStatus('saving', '同期中...');
  try {
    const res = await fetch(GH_API, {
      headers: {'Authorization': 'token ' + GH_TOKEN, 'Accept': 'application/vnd.github.v3+json'}
    });
    if (res.status === 404) { setSyncStatus('ok', '新規作成待ち'); return null; }
    if (res.status === 401 || res.status === 403) { setSyncStatus('err', 'Token無効'); return null; }
    if (!res.ok) { setSyncStatus('err', 'エラー'); return null; }
    const data = await res.json();
    GH_SHA = data.sha;
    const content = base64ToUtf8(data.content.replace(/\n/g, ''));
    setSyncStatus('ok', '同期済み ✓');
    return JSON.parse(content);
  } catch(e) {
    setSyncStatus('err', '接続エラー');
    return null;
  }
}

async function ghSave() {
  if (!GH_TOKEN || !STATE) return false;
  setSyncStatus('saving', '保存中...');
  try {
    const content = utf8ToBase64(JSON.stringify(STATE, null, 2));
    const body = {
      message: 'Update recruitment data - ' + new Date().toISOString().split('T')[0],
      content: content
    };
    if (GH_SHA) body.sha = GH_SHA;
    const res = await fetch(GH_API, {
      method: 'PUT',
      headers: {'Authorization': 'token ' + GH_TOKEN, 'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    if (res.status === 409) {
      setSyncStatus('err', '競合発生');
      if (confirm('他の人が先に更新しました。最新データを取得しますか？')) {
        await syncFromGitHub();
      }
      return false;
    }
    if (res.ok) {
      const data = await res.json();
      GH_SHA = data.content.sha;
      // Also cache locally
      try { localStorage.setItem(LS_CACHE_KEY, JSON.stringify(STATE)); } catch(e){}
      setSyncStatus('ok', '保存済み ✓');
      return true;
    }
    setSyncStatus('err', '保存失敗');
    return false;
  } catch(e) {
    setSyncStatus('err', '接続エラー');
    return false;
  }
}

async function syncFromGitHub() {
  const data = await ghFetch();
  if (data) {
    STATE = data;
    try { localStorage.setItem(LS_CACHE_KEY, JSON.stringify(STATE)); } catch(e){}
    render();
    showToast('最新データを取得しました');
  } else if (!STATE) {
    // No remote data and no local state - use defaults
    STATE = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
}

// ===== SETUP DIALOG =====
function showSetupDialog(errMsg) { showTokenSetup(errMsg); return; /* original below */
  document.getElementById('setupOverlay').innerHTML = '<div class="setup-overlay" onclick="if(event.target===this&&STATE)this.innerHTML=\'\'">' +
    '<div class="setup-box">' +
    '<h2>GitHub 接続設定</h2>' +
    '<p>チーム全員がこの看板を編集するには、GitHubのPersonal Access Tokenが必要です。</p>' +
    '<div class="steps">' +
    '<strong>Token作成手順：</strong><br>' +
    '1. <a href="https://github.com/settings/tokens?type=beta" target="_blank">こちらをクリック</a> してGitHubを開く<br>' +
    '2. 「Generate new token」をクリック<br>' +
    '3. Token name: <code>VJP採用看板</code><br>' +
    '4. Expiration: 任意（90 daysなど）<br>' +
    '5. Repository access → Only select → <code>vjp_gogogo</code><br>' +
    '6. Permissions → Contents → Read and write<br>' +
    '7. 「Generate token」→ トークンをコピー' +
    '</div>' +
    (errMsg ? '<div class="err" style="display:block">' + errMsg + '</div>' : '') +
    '<input type="text" id="tokenInput" placeholder="ghp_xxxx... を貼り付け" value="' + (GH_TOKEN||'') + '">' +
    '<button onclick="connectGitHub()">接続</button>' +
    (STATE ? '<div class="skip"><a onclick="document.getElementById(\'setupOverlay\').innerHTML=\'\'">キャンセル</a></div>' : '<div class="skip"><a onclick="useOffline()">オフラインで使う（GitHub同期なし）</a></div>') +
    '</div></div>';
}

async function connectGitHub() {
  const token = document.getElementById('tokenInput').value.trim();
  if (!token) return;
  GH_TOKEN = token;
  localStorage.setItem(LS_TOKEN_KEY, token);
  document.getElementById('setupOverlay').innerHTML = '<div class="loading-overlay">GitHub に接続中...</div>';
  const data = await ghFetch();
  if (data) {
    STATE = data;
    try { localStorage.setItem(LS_CACHE_KEY, JSON.stringify(STATE)); } catch(e){}
    document.getElementById('setupOverlay').innerHTML = '';
    render();
    showToast('GitHub接続成功！');
  } else if (GH_SHA === '' && GH_TOKEN) {
    // File doesn't exist yet - create it
    STATE = JSON.parse(JSON.stringify(DEFAULT_DATA));
    const ok = await ghSave();
    document.getElementById('setupOverlay').innerHTML = '';
    if (ok) {
      render();
      showToast('GitHub接続成功！初期データを作成しました');
    } else {
      showSetupDialog('接続できませんでした。Tokenを確認してください。');
    }
  } else {
    showSetupDialog('接続できませんでした。Tokenを確認してください。');
  }
}

function useOffline() {
  GH_TOKEN = '';
  localStorage.removeItem(LS_TOKEN_KEY);
  // Load from cache or defaults
  try {
    const cached = localStorage.getItem(LS_CACHE_KEY);
    STATE = cached ? JSON.parse(cached) : JSON.parse(JSON.stringify(DEFAULT_DATA));
  } catch(e) {
    STATE = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  document.getElementById('setupOverlay').innerHTML = '';
  setSyncStatus('offline', 'オフライン');
  render();
}

// ===== INIT =====
async function init() {
  // Check if already authenticated this session
  if (checkAuth()) {
    document.getElementById('loginOverlay').style.display = 'none';
    afterLogin();
    return;
  }
  // Show login screen, hide dashboard
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('loginPassword').focus();
  /* original init below - kept for reference */
  return;
  if (GH_TOKEN) {
    const data = await ghFetch();
    if (data) {
      STATE = data;
      try { localStorage.setItem(LS_CACHE_KEY, JSON.stringify(STATE)); } catch(e){}
      render();
    } else {
      // Try cache
      try {
        const cached = localStorage.getItem(LS_CACHE_KEY);
        if (cached) { STATE = JSON.parse(cached); render(); }
        else { STATE = JSON.parse(JSON.stringify(DEFAULT_DATA)); render(); }
      } catch(e) { STATE = JSON.parse(JSON.stringify(DEFAULT_DATA)); render(); }
    }
  } else {
    // No token - show setup
    try {
      const cached = localStorage.getItem(LS_CACHE_KEY);
      if (cached) { STATE = JSON.parse(cached); render(); setSyncStatus('offline','オフライン'); }
    } catch(e) {}
    showSetupDialog();
  }
}

// Auto-refresh when tab gets focus
document.addEventListener('visibilitychange', function() {
  if (!document.hidden && GH_TOKEN) syncFromGitHub();
});

// ===== SAVE WRAPPER =====
async function saveAndSync() {
  // Always cache locally first
  try { localStorage.setItem(LS_CACHE_KEY, JSON.stringify(STATE)); } catch(e){}
  // Then sync to GitHub
  if (GH_TOKEN) await ghSave();
  render();
}

// ===== RENDER =====
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(function(t,i) {
    t.classList.toggle('active', ['positions','candidates','funnel'][i] === tab);
  });
  render();
}

function render() {
  if (!STATE) return;
  renderStats();
  if (currentTab === 'positions') renderPositions();
  else if (currentTab === 'candidates') renderCandidates();
  else renderFunnel();
}

function renderStats() {
  var p = STATE.positions, c = STATE.candidates;
  var open = p.filter(function(x){return x.status==='OPEN'}).length;
  var hired = c.filter(function(x){return x.status==='已入社'||x.status==='内定承諾'}).length;
  var active = c.filter(function(x){return !['見送り','辞退','已入社','内定承諾'].includes(x.status)}).length;
  document.getElementById('statsBar').innerHTML =
    '<div class="stat"><div class="num" style="color:var(--open)">'+open+'</div><div class="lbl">OPEN</div></div>' +
    '<div class="stat"><div class="num">'+p.length+'</div><div class="lbl">全ポジション</div></div>' +

function renderPositions() {
  var filtered = STATE.positions.filter(function(p) {
    if (!posFilter.showClosed && p.status === 'CLOSE') return false;
    if (posFilter.status !== 'all' && p.status !== posFilter.status) return false;
    if (posFilter.priority !== 'all' && p.priority !== posFilter.priority) return false;
    if (posFilter.dept && posFilter.dept !== 'all' && (p.dept||'未分類') !== posFilter.dept) return false;
    if (posFilter.search && !p.name.toLowerCase().includes(posFilter.search.toLowerCase()) && !(p.dept||'').toLowerCase().includes(posFilter.search.toLowerCase())) return false;
    return true;
  });
  var priOrder = {HIGH:1,MID:2,LOW:3};
  var statusOrder = {OPEN:1,'確認中':2,'未掲載':3,CLOSE:4};
  filtered.sort(function(a,b){ return (statusOrder[a.status]||9) - (statusOrder[b.status]||9) || (priOrder[a.priority]||9) - (priOrder[b.priority]||9); });
  var statuses = []; STATE.positions.forEach(function(p){if(p.status && !statuses.includes(p.status)) statuses.push(p.status);}); statuses.sort();
  // Group by department
  var deptOrder = [];
  var deptMap = {};
  filtered.forEach(function(p){
    var d = p.dept || '未分類';
    if (!deptMap[d]) { deptMap[d] = []; deptOrder.push(d); }
    deptMap[d].push(p);
  });
  var depts = []; STATE.positions.forEach(function(p){if(p.dept && !depts.includes(p.dept)) depts.push(p.dept);}); depts.sort();
  var html = '<div class="filter-bar"><label>ステータス:</label><select onchange="posFilter.status=this.value;render()"><option value="all">全て</option>';
  statuses.forEach(function(s){html+='<option value="'+esc(s)+'" '+(posFilter.status===s?'selected':'')+'>'+esc(s)+'</option>';});
  html += '</select><label>優先度:</label><select onchange="posFilter.priority=this.value;render()"><option value="all">全て</option>';
  ['HIGH','MID','LOW'].forEach(function(s){html+='<option value="'+s+'" '+(posFilter.priority===s?'selected':'')+'>'+s+'</option>';});
  html += '</select><label>部門:</label><select onchange="posFilter.dept=this.value;render()"><option value="all">全て</option>';
  depts.forEach(function(d){html+='<option value="'+esc(d)+'" '+((posFilter.dept||'all')===d?'selected':'')+'>'+esc(d)+'</option>';});
  html += '</select><input type="text" placeholder="検索..." value="'+esc(posFilter.search)+'" oninput="posFilter.search=this.value;render()" style="flex:1;max-width:200px"><div class="toggle-wrap"><label class="toggle"><input type="checkbox" '+(posFilter.showClosed?'checked':'')+' onchange="posFilter.showClosed=this.checked;render()"><span class="slider"></span></label><span class="toggle-label" onclick="posFilter.showClosed=!posFilter.showClosed;render()">CLOSE表示</span></div><button class="add-btn" onclick="showAddPosition()">＋ 新規ポジション</button></div>';
  if (!filtered.length) { html += '<div style="text-align:center;padding:40px;color:var(--sub)">該当なし</div>'; document.getElementById('content').innerHTML = html; return; }
  // Business division mapping
  var RETAIL_DEPTS = ['店舗運営','店铺运营','新店拓展','渠道开拓','渠道開拓','Retail','Store','店舗','店铺'];
  var HR_DEPTS = ['人事','总务','総務','HR','HRGA','人事総務','人事/总务','General Affairs','Admin'];
  function isRetail(dept){ return RETAIL_DEPTS.some(function(r){ return dept.toLowerCase().indexOf(r.toLowerCase())>=0; }); }
  function isHR(dept){ return HR_DEPTS.some(function(r){ return dept.toLowerCase().indexOf(r.toLowerCase())>=0; }); }
  // Build pipeline map: position name -> candidates by stage (exclude 見送り/辞退)
  // Use fuzzy matching: candidate position may be a substring of position name or vice versa
  var pipeMap = {};
  var posNames = filtered.map(function(p){ return p.name; });
  function matchPosName(candPos) {
    var cp = (candPos||'').toLowerCase().replace(/[\s　]/g,'');
    for (var i=0; i<posNames.length; i++) {
      var pn = posNames[i].toLowerCase().replace(/[\s　]/g,'');
      if (pn.indexOf(cp) >= 0 || cp.indexOf(pn) >= 0 || pn === cp) return posNames[i];
    }
    return null;
  }
  STATE.candidates.forEach(function(c){
    if (!c.position) return;
    var isRejected = (c.judgment||'').includes('見送り') || c.status==='見送り' || c.status==='辞退';
    if (isRejected) return;
    var matched = matchPosName(c.position);
    if (!matched) return;
    if (!pipeMap[matched]) pipeMap[matched] = {total:0, stages:{}};
    pipeMap[matched].total++;
    var st = c.status || '未設定';
    pipeMap[matched].stages[st] = (pipeMap[matched].stages[st]||0) + 1;
  });
  function renderBizTable(deptList) {
    if(!deptList.length) return '<div style="text-align:center;padding:30px;color:var(--sub);font-size:13px">該当ポジションなし</div>';

    deptList.forEach(function(dept){
      var items = deptMap[dept].slice().sort(function(a,b){ return (statusOrder[a.status]||9) - (statusOrder[b.status]||9) || (priOrder[a.priority]||9) - (priOrder[b.priority]||9); });
      h += '<tr class="dept-divider"><td colspan="10"><span class="dept-divider-name">'+esc(dept)+'</span></td></tr>';
      items.forEach(function(p){
        var sc=p.status==='OPEN'?'open':p.status==='CLOSE'?'close':(p.status==='確認中'||p.status==='未掲載')?'hold':'unpub';
        var pc=p.priority==='HIGH'?'high':p.priority==='MID'?'mid':'low';
        var pipe = pipeMap[p.name];
        var pipeHtml = '';
        if (pipe && pipe.total > 0) {
          var detailParts = [];
          Object.keys(pipe.stages).forEach(function(st){ detailParts.push(st+' '+pipe.stages[st]+'名'); });
          var pid = 'pipe_'+p.id;
          pipeHtml = '<span class="pipe-count clickable" onclick="event.stopPropagation();var el=document.getElementById(\''+pid+'\');el.style.display=el.style.display===\'block\'?\'none\':\'block\'">'+pipe.total+'名</span>';
          pipeHtml += '<div id="'+pid+'" class="pipe-detail" style="display:none">';
          Object.keys(pipe.stages).forEach(function(st){
            pipeHtml += '<a class="pipe-stage" onclick="event.stopPropagation();candFilter.position=\''+esc(p.name).replace(/'/g,"\\'")+'\';candFilter.dateRange=\'all\';document.querySelector(\'.tab.active\').classList.remove(\'active\');currentTab=\'candidates\';render();document.querySelectorAll(\'.tab\')[1].classList.add(\'active\')">'+esc(st)+' <b>'+pipe.stages[st]+'</b></a>';
          });
          pipeHtml += '</div>';
        } else {
          pipeHtml = '<span style="color:var(--sub)">—</span>';
        }
        h+='<tr><td class="clickable" onclick="showPositionDetail(\''+p.id+'\')">'+esc(p.name||'（未設定）')+'</td><td><span class="badge badge-'+sc+'">'+esc(p.status||'—')+'</span></td><td class="pri-'+pc+'">'+esc(p.priority||'—')+'</td><td>'+pipeHtml+'</td><td>'+esc(p.salary||'—')+'</td><td>'+esc(p.headcount||'—')+'</td><td title="'+esc(p.channels||'')+'">'+esc((p.channels||'—').substring(0,15))+'</td><td title="'+esc(p.memo||'')+'">'+esc((p.memo||'—').substring(0,20))+((p.memo||'').length>20?'...':'')+'</td><td>'+(p.updatedAt||'—')+'</td><td><button class="btn-secondary" onclick="showEditPosition(\''+p.id+'\')">編集</button></td></tr>';
      });
    });
    h += '</tbody></table>';
    return h;
  }
  var retailDepts=[], brandDepts=[], hrDepts=[];
  deptOrder.forEach(function(dept){
    if(isRetail(dept)) retailDepts.push(dept);
    else if(isHR(dept)) hrDepts.push(dept);
    else brandDepts.push(dept);
  });
  function countDept(arr){ var t=0,o=0; arr.forEach(function(d){t+=deptMap[d].length; deptMap[d].forEach(function(p){if(p.status==='OPEN'||p.status==='確認中'||p.status==='未掲載')o++;});}); return {total:t,open:o}; }
  var rc=countDept(retailDepts), bc=countDept(brandDepts), hc=countDept(hrDepts);
  html += '<div class="biz-columns">';
  html += '<div class="biz-block"><div class="biz-block-header"><h2>Retail Business</h2><span class="biz-count">'+rc.total+'件</span>'+(rc.open?'<span class="dept-open">'+rc.open+' open</span>':'')+'</div>';
  html += renderBizTable(retailDepts);
  html += '</div>';
  html += '<div class="biz-block"><div class="biz-block-header"><h2>Brand 推進</h2><span class="biz-count">'+bc.total+'件</span>'+(bc.open?'<span class="dept-open">'+bc.open+' open</span>':'')+'</div>';
  html += renderBizTable(brandDepts);
  html += '</div>';
  html += '<div class="biz-block"><div class="biz-block-header"><h2>人事総務</h2><span class="biz-count">'+hc.total+'件</span>'+(hc.open?'<span class="dept-open">'+hc.open+' open</span>':'')+'</div>';
  html += renderBizTable(hrDepts);
  html += '</div></div>';
  document.getElementById('content').innerHTML = html;
}

function renderCandidates() {
  var now = new Date();
  var STAGES = ['書類選考','casual面談','一次面接','二次面接','内定承諾','已入社','見送り','辞退'];
  var filtered = STATE.candidates.filter(function(c) {
    if (candFilter.search && !c.name.toLowerCase().includes(candFilter.search.toLowerCase()) && !(c.position||'').toLowerCase().includes(candFilter.search.toLowerCase())) return false;
    if (candFilter.position && candFilter.position !== 'all' && c.position !== candFilter.position) return false;
    if (candFilter.dateRange !== 'all') {
      var created = new Date(c.createdAt);
      if (candFilter.dateRange === 'custom') {
        if (candFilter.fromDate && created < new Date(candFilter.fromDate)) return false;
        if (candFilter.toDate && created > new Date(candFilter.toDate + 'T23:59:59')) return false;
      } else if (candFilter.dateRange === 'year') {
        if (created.getFullYear() !== now.getFullYear()) return false;
      } else {
        var days = (now - created) / 86400000;
        var limit = {m1:30,m3:90,m6:180}[candFilter.dateRange];
        if (limit && days > limit) return false;
      }
    }
    return true;
  });
  // Stage summary counts
  var stageCounts = {};
  STAGES.forEach(function(s){ stageCounts[s] = 0; });
  filtered.forEach(function(c){
    var st = c.status || '';
    if (stageCounts.hasOwnProperty(st)) stageCounts[st]++;
    else { stageCounts[st] = 1; STAGES.push(st); }
  });
  var positions = []; STATE.candidates.forEach(function(c){if(c.position && !positions.includes(c.position)) positions.push(c.position);}); positions.sort();
  // Filter bar
  var html = '<div class="filter-bar"><label>期間:</label>';
  [{k:'all',l:'全期間'},{k:'year',l:'今年'},{k:'m1',l:'1ヶ月'},{k:'m3',l:'3ヶ月'},{k:'m6',l:'半年'},{k:'custom',l:'カスタム'}].forEach(function(f){
    html+='<button class="btn '+(candFilter.dateRange===f.k?'active':'')+'" onclick="candFilter.dateRange=\''+f.k+'\';render()">'+f.l+'</button>';
  });
  if (candFilter.dateRange==='custom') {
    html+='<input type="date" value="'+esc(candFilter.fromDate)+'" onchange="candFilter.fromDate=this.value;render()" style="font-size:12px">';
    html+='<span style="color:var(--sub);font-size:12px">〜</span>';
    html+='<input type="date" value="'+esc(candFilter.toDate)+'" onchange="candFilter.toDate=this.value;render()" style="font-size:12px">';
  }
  html += '<label>ポジション:</label><select onchange="candFilter.position=this.value;render()"><option value="all">全て</option>';
  positions.forEach(function(p){html+='<option value="'+esc(p)+'" '+(candFilter.position===p?'selected':'')+'>'+esc(p)+'</option>';});
  html += '</select><input type="text" placeholder="名前/ポジション検索..." value="'+esc(candFilter.search)+'" oninput="candFilter.search=this.value;render()" style="flex:1;max-width:200px">';
  // View toggle + add button
  html += '<div class="view-toggle"><button class="'+(candView==='status'?'active':'')+'" onclick="candView=\'status\';render()">ステータス別</button><button class="'+(candView==='position'?'active':'')+'" onclick="candView=\'position\';render()">ポジション別</button></div>';
  html += '<button class="add-btn" onclick="showAddCandidate()">＋ 新規候補者</button></div>';
  // Stage summary bar
  html += '<div class="stage-summary">';
  html += '<span class="stage-pill"><b>'+filtered.length+'</b> 合計</span>';
  STAGES.forEach(function(s){
    var n = stageCounts[s] || 0;
    html += '<span class="stage-pill'+(n===0?' zero':'')+'"><b>'+n+'</b> '+esc(s)+'</span>';
  });
  html += '</div>';
  if (candView === 'status') {
    // === STATUS VIEW (kanban) ===
    var columns = [{key:'選考中',statuses:['書類選考','一次面接','二次面接']},{key:'内定・入社',statuses:['内定承諾','已入社']},{key:'見送り・辞退',statuses:['見送り','辞退']}];
    html += '<div class="kanban">';
    columns.forEach(function(col){
      var items = filtered.filter(function(c){
        var isRejected = (c.judgment||'').includes('見送り') || c.status==='見送り' || c.status==='辞退';
        if (col.key==='見送り・辞退') return isRejected;
        if (col.key==='内定・入社') return !isRejected && col.statuses.includes(c.status);
        if (col.key==='選考中') return !isRejected && !['内定承諾','已入社'].includes(c.status) && c.status;
        return col.statuses.includes(c.status);
      });
      items.sort(function(a,b){ return new Date(b.createdAt||0) - new Date(a.createdAt||0); });
      html+='<div class="kanban-col"><h3>'+col.key+' <span class="cnt">'+items.length+'</span></h3>';
      if (!items.length) html+='<div style="text-align:center;color:var(--sub);font-size:12px;padding:20px">なし</div>';
      items.forEach(function(c){
        var days=Math.floor((now-new Date(c.createdAt))/86400000);
        var isStale=days>90&&!['已入社','内定承諾'].includes(c.status);
        html+='<div class="cand-card '+(isStale?'stale':'')+'" onclick="showCandidateDetail(\''+c.id+'\')"><div class="name">'+esc(c.name)+'</div><div class="pos">'+esc(c.position||'未設定')+' ・ '+esc(c.status||'')+'</div><div class="judgment">'+esc(c.judgment||'')+'</div><div class="date">'+c.createdAt+' ('+days+'日前)</div></div>';
      });
      html+='</div>';
    });
    html += '</div>';
  } else {
    // === POSITION VIEW ===
    var posMap = {};
    filtered.forEach(function(c){
      var pos = c.position || '未設定';
      if (!posMap[pos]) posMap[pos] = [];
      posMap[pos].push(c);
    });
    var posKeys = Object.keys(posMap).sort(function(a,b){ return posMap[b].length - posMap[a].length; });
    posKeys.forEach(function(pos){
      var cands = posMap[pos];
      // Count stages for this position
      var posStages = {};
      cands.forEach(function(c){ var s=c.status||'未設定'; posStages[s]=(posStages[s]||0)+1; });
      html += '<div class="pos-group"><div class="pos-group-header" onclick="candFilter.position=\''+esc(pos).replace(/'/g,"\\'")+'\';candView=\'status\';render()">';
      html += '<h4>'+esc(pos)+'</h4><div class="pos-stages">';
      STAGES.forEach(function(s){
        if (posStages[s]) html += '<span class="pos-stage-tag">'+esc(s)+' <b>'+posStages[s]+'</b></span>';
      });
      // any stages not in STAGES
      Object.keys(posStages).forEach(function(s){ if (STAGES.indexOf(s)<0 && posStages[s]) html += '<span class="pos-stage-tag">'+esc(s)+' <b>'+posStages[s]+'</b></span>'; });
      html += '</div><span class="pos-total">'+cands.length+'名</span></div>';
      // Candidate cards under this position
      html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;padding:0 8px">';
      cands.sort(function(a,b){ var so={書類選考:1,casual面談:2,一次面接:3,二次面接:4,内定承諾:5,已入社:6,見送り:7,辞退:8}; return (so[a.status]||9)-(so[b.status]||9); });
      cands.forEach(function(c){
        var days=Math.floor((now-new Date(c.createdAt))/86400000);
        var isStale=days>90&&!['已入社','内定承諾'].includes(c.status);
        html+='<div class="cand-card '+(isStale?'stale':'')+'" onclick="showCandidateDetail(\''+c.id+'\')"><div class="name">'+esc(c.name)+'</div><div class="pos">'+esc(c.status||'')+' ・ '+esc(c.judgment||'')+'</div><div class="date">'+c.createdAt+' ('+days+'日前)</div></div>';
      });
      html += '</div></div>';
    });
    if (!posKeys.length) html += '<div style="text-align:center;color:var(--sub);padding:40px">該当候補者なし</div>';
  }
  document.getElementById('content').innerHTML = html;
}

var FUNNEL_FIELDS = ['応募数','SC通過','SC不合格','一面実施','一面通過','一面不合格','二面実施','二面通過','二面不合格','オファー','内定承諾','辞退'];

function getWeekKey(offset) {
  var d = new Date(); d.setDate(d.getDate() + offset * 7);
  var tmp = new Date(d.valueOf()); tmp.setDate(tmp.getDate() + 3 - (tmp.getDay() + 6) % 7);
  var week1 = new Date(tmp.getFullYear(), 0, 4);
  var weekNum = 1 + Math.round(((tmp - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
  return tmp.getFullYear() + '-W' + String(weekNum).padStart(2,'0');
}
function getWeekDates(wk) {
  var parts = wk.split('-W'), y = parseInt(parts[0]), w = parseInt(parts[1]);
  var jan4 = new Date(y, 0, 4), dow = jan4.getDay() || 7;
  var mon = new Date(jan4); mon.setDate(jan4.getDate() - dow + 1 + (w - 1) * 7);
  var sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  return (mon.getMonth()+1)+'/'+mon.getDate()+' ～ '+(sun.getMonth()+1)+'/'+sun.getDate();
}

function renderFunnel() {
  var weekKey = getWeekKey(funnelWeekOffset), weekDates = getWeekDates(weekKey);
  var weekData = STATE.weekly[weekKey] || {};
  var openPos = STATE.positions.filter(function(p){return p.status!=='CLOSE'}).sort(function(a,b){var po={HIGH:0,MID:1,LOW:2};return (po[a.priority]||9)-(po[b.priority]||9);});
  var totals = {}; FUNNEL_FIELDS.forEach(function(f){totals[f]=0;});
  Object.values(weekData).forEach(function(row){FUNNEL_FIELDS.forEach(function(f){totals[f]+=(row[f]||0);});});
  var html = '<div class="funnel-header"><h3>週次採用ファネル</h3><div class="week-nav"><button onclick="funnelWeekOffset--;render()">◀</button><div class="week-label">'+weekKey+'<br><span style="font-size:11px;color:var(--sub)">'+weekDates+'</span></div><button onclick="funnelWeekOffset++;render()">▶</button><button onclick="funnelWeekOffset=0;render()" style="margin-left:8px;font-size:11px">今週</button></div><div>';
  html += funnelEditing ? '<button class="add-btn" onclick="saveFunnelData(\''+weekKey+'\')">💾 保存</button><button class="btn-secondary" style="margin-left:4px" onclick="funnelEditing=false;render()">キャンセル</button>' : '<button class="add-btn" onclick="funnelEditing=true;render()">✏️ 編集</button>';
  html += '</div></div><table class="funnel-table"><thead><tr><th>ポジション</th>';
  FUNNEL_FIELDS.forEach(function(f){html+='<th>'+esc(f)+'</th>';});
  html += '<th>備考</th></tr></thead><tbody><tr class="subtotal"><td>合計</td>';
  FUNNEL_FIELDS.forEach(function(f){html+='<td>'+(totals[f]||'')+'</td>';});
  html += '<td></td></tr>';
  openPos.forEach(function(p){
    var row = weekData[p.name] || {};
    html += '<tr><td>'+esc(p.name)+'</td>';
    if (funnelEditing) {
      FUNNEL_FIELDS.forEach(function(f){html+='<td><input type="number" min="0" value="'+(row[f]||'')+'" data-pos="'+esc(p.name)+'" data-field="'+esc(f)+'"></td>';});
      html += '<td><input type="text" value="'+esc(row.memo||'')+'" data-pos="'+esc(p.name)+'" data-field="memo" style="width:100px"></td>';
    } else {
      FUNNEL_FIELDS.forEach(function(f){html+='<td>'+(row[f]||'')+'</td>';});
      html += '<td>'+esc(row.memo||'')+'</td>';
    }
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('content').innerHTML = html;
}

async function saveFunnelData(weekKey) {
  if (!STATE.weekly[weekKey]) STATE.weekly[weekKey] = {};
  document.querySelectorAll('.funnel-table input').forEach(function(inp){
    var pos=inp.dataset.pos, field=inp.dataset.field;
    if (!pos||!field) return;
    if (!STATE.weekly[weekKey][pos]) STATE.weekly[weekKey][pos]={};
    STATE.weekly[weekKey][pos][field] = field==='memo' ? inp.value : (parseInt(inp.value)||0);
  });
  funnelEditing = false;
  await saveAndSync();
  showToast('保存しました');
}

// Multi-select component
var MS_OPTIONS = {
  nationality: ['日本Local','中国','韓国','グローバル','不問'],
  base: ['東京','北京','リモート','東京/北京'],
  channels: ['AMBI','LinkedIn','Indeed','Wantedly','Green','doda','エージェント','紹介','自社HP','その他']
};
var msCounter = 0;
function multiSelectHtml(name, currentVal, placeholder) {
  var id = 'ms_' + (msCounter++);
  var selected = (currentVal||'').split(/[,、\/]+/).map(function(s){return s.trim();}).filter(Boolean);
  var options = (MS_OPTIONS[name]||[]).slice();
  // add any existing values not in defaults
  selected.forEach(function(s){ if(options.indexOf(s)<0 && s) options.push(s); });
  var tags = selected.map(function(s){return '<span class="ms-tag" data-v="'+esc(s)+'">'+esc(s)+'<span class="ms-rm" onclick="event.stopPropagation();msRemove(\''+id+'\',\''+esc(s).replace(/'/g,"\\'")+'\')">×</span></span>';}).join('');
  var optHtml = options.map(function(o){
    var sel = selected.indexOf(o)>=0;
    return '<div class="ms-opt'+(sel?' sel':'')+'" onclick="msToggle(\''+id+'\',\''+esc(o).replace(/'/g,"\\'")+'\',this)"><span class="ms-chk">'+(sel?'✓':'')+'</span>'+esc(o)+'</div>';
  }).join('');
  return '<div class="ms-wrap" id="'+id+'"><input type="hidden" name="'+name+'" value="'+esc(currentVal||'')+'"><div class="ms-selected" onclick="msOpen(\''+id+'\')">'+(tags||'<span class="ms-ph">'+esc(placeholder||'選択...')+'</span>')+'</div><div class="ms-dd"><div class="ms-input-row"><input placeholder="新規追加..." onkeydown="if(event.key===\'Enter\'){event.preventDefault();msAddCustom(\''+id+'\',this);}"></div>'+optHtml+'</div></div>';
}
function msOpen(id) {
  var wrap = document.getElementById(id);
  var dd = wrap.querySelector('.ms-dd');
  var sel = wrap.querySelector('.ms-selected');
  var isOpen = dd.classList.contains('show');
  // close all others first
  document.querySelectorAll('.ms-dd.show').forEach(function(d){d.classList.remove('show');d.parentElement.querySelector('.ms-selected').classList.remove('open');});
  if (!isOpen) { dd.classList.add('show'); sel.classList.add('open'); }
}
function msToggle(id, val, optEl) {
  var wrap = document.getElementById(id);
  var hidden = wrap.querySelector('input[type=hidden]');
  var vals = hidden.value ? hidden.value.split(/[,、]+/).map(function(s){return s.trim();}).filter(Boolean) : [];
  var idx = vals.indexOf(val);
  if (idx >= 0) { vals.splice(idx, 1); optEl.classList.remove('sel'); optEl.querySelector('.ms-chk').textContent=''; }
  else { vals.push(val); optEl.classList.add('sel'); optEl.querySelector('.ms-chk').textContent='✓'; }
  hidden.value = vals.join(', ');
  msRenderTags(id, vals);
}
function msRemove(id, val) {
  var wrap = document.getElementById(id);
  var hidden = wrap.querySelector('input[type=hidden]');
  var vals = hidden.value.split(/[,、]+/).map(function(s){return s.trim();}).filter(Boolean);
  vals = vals.filter(function(v){return v!==val;});
  hidden.value = vals.join(', ');
  msRenderTags(id, vals);
  // update dropdown checkmarks
  wrap.querySelectorAll('.ms-opt').forEach(function(o){
    var t = o.textContent.replace('✓','').trim();
    if (t === val) { o.classList.remove('sel'); o.querySelector('.ms-chk').textContent=''; }
  });
}
function msRenderTags(id, vals) {
  var wrap = document.getElementById(id);
  var selDiv = wrap.querySelector('.ms-selected');
  if (!vals.length) { selDiv.innerHTML = '<span class="ms-ph">選択...</span>'; return; }
  selDiv.innerHTML = vals.map(function(s){return '<span class="ms-tag" data-v="'+esc(s)+'">'+esc(s)+'<span class="ms-rm" onclick="event.stopPropagation();msRemove(\''+id+'\',\''+s.replace(/'/g,"\\'")+'\')">×</span></span>';}).join('');
}
function msAddCustom(id, input) {
  var val = input.value.trim(); if (!val) return;
  input.value = '';
  var wrap = document.getElementById(id);
  var hidden = wrap.querySelector('input[type=hidden]');
  var vals = hidden.value ? hidden.value.split(/[,、]+/).map(function(s){return s.trim();}).filter(Boolean) : [];
  if (vals.indexOf(val) >= 0) return;
  vals.push(val);
  hidden.value = vals.join(', ');
  msRenderTags(id, vals);
  // add option to dropdown
  var dd = wrap.querySelector('.ms-dd');
  var optDiv = document.createElement('div');
  optDiv.className = 'ms-opt sel';
  optDiv.innerHTML = '<span class="ms-chk">✓</span>'+esc(val);
  optDiv.onclick = function(){ msToggle(id, val, optDiv); };
  dd.appendChild(optDiv);
}
// close multi-select on outside click
document.addEventListener('click', function(e) {
  if (!e.target.closest('.ms-wrap')) {
    document.querySelectorAll('.ms-dd.show').forEach(function(d){d.classList.remove('show');d.parentElement.querySelector('.ms-selected').classList.remove('open');});
  }
});

  var opts = '<option value="">-- 選択 --</option>';
  var openPos = STATE.positions.filter(function(p){return p.status!=='CLOSE'}).sort(function(a,b){return (a.dept||'').localeCompare(b.dept||'');});
  var closedPos = STATE.positions.filter(function(p){return p.status==='CLOSE'});
  if (openPos.length) {
    opts += '<optgroup label="募集中">';

function handleResumeUpload(inputEl) {
  var file = inputEl.files[0]; if (!file) return;
  if (file.size > 5*1024*1024) { alert('ファイルサイズは5MB以下にしてください'); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    var container = inputEl.closest('.field');
    container.querySelector('.resume-data').value = e.target.result;
    container.querySelector('.resume-name-val').value = file.name;
    var preview = container.querySelector('.resume-preview');
    preview.innerHTML = '<span class="resume-link">📄 '+esc(file.name)+' <span style="color:var(--sub);font-size:11px">'+(file.size/1024).toFixed(0)+'KB</span></span>';
    preview.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

  var hasResume = resumeData && resumeName;
  return '<div class="field"><label>履歴書・職務経歴書</label>'+

    '<div class="resume-upload" onclick="this.querySelector(\'input\').click()">'+
    '<input type="file" accept=".pdf,.doc,.docx,.txt" style="display:none" onchange="handleResumeUpload(this)">'+
    '<div style="color:var(--sub);font-size:13px">'+(hasResume?'📎 ファイルを変更':'📎 ファイルをアップロード')+'</div>'+

    '</div></div>';
}

async function savePosition(e, id) {

  var p = STATE.positions.find(function(x){return x.id===id;}); if(!p) return;
  p.name=f.name.value;p.status=f.status.value;p.priority=f.priority.value;p.dept=f.dept.value;p.salary=f.salary.value;p.headcount=f.headcount.value;p.nationality=f.nationality.value;p.base=f.base.value;p.channels=f.channels.value;p.jd=f.jd.value;p.requirements=f.requirements.value;p.jobLink=f.jobLink.value;p.memo=f.memo.value;p.updatedAt=new Date().toISOString().split('T')[0];
  closeModal(); await saveAndSync(); showToast('ポジション更新しました');
}

  e.preventDefault(); var f=e.target;
  STATE.positions.push({id:'p'+(STATE.nextPosId++),name:f.name.value,status:f.status.value,priority:f.priority.value,dept:f.dept.value,salary:f.salary.value,headcount:f.headcount.value,nationality:f.nationality.value,base:f.base.value,channels:f.channels.value,jd:f.jd.value,requirements:f.requirements.value,jobLink:f.jobLink.value,memo:f.memo.value,updatedAt:new Date().toISOString().split('T')[0]});
  closeModal(); await saveAndSync(); showToast('ポジション追加しました');

  e.preventDefault(); var f=e.target;
  var c = STATE.candidates.find(function(x){return x.id===id;}); if(!c) return;
  c.name=f.name.value;c.position=f.position.value;c.status=f.status.value;c.judgment=f.judgment.value;c.age=f.age.value?parseInt(f.age.value):null;c.location=f.location.value;c.japanese=f.japanese.value;c.english=f.english.value;c.salary=f.salary.value;
  var rd=f.resumeData.value; if(rd&&rd!=='HAS_DATA'){c.resumeData=rd;c.resumeName=f.resumeName.value;} else if(!rd){c.resumeData='';c.resumeName='';}
  c.coreExp=f.coreExp.value;c.interviewEval=f.interviewEval.value;c.coreRisk=f.coreRisk.value;c.reason=f.reason.value;
  closeModal(); await saveAndSync(); showToast('候補者更新しました');
}
async function addCandidate(e) {
  e.preventDefault(); var f=e.target;
  var newCand = {id:'c'+(STATE.nextCandId++),name:f.name.value,position:f.position.value,status:f.status.value,judgment:f.judgment.value,age:f.age.value?parseInt(f.age.value):null,location:f.location.value,japanese:f.japanese.value,english:f.english.value,salary:f.salary.value,coreExp:f.coreExp.value,interviewEval:f.interviewEval.value,coreRisk:f.coreRisk.value,reason:f.reason.value,createdAt:new Date().toISOString().split('T')[0]};
  var rd=f.resumeData.value; if(rd&&rd!=='HAS_DATA'){newCand.resumeData=rd;newCand.resumeName=f.resumeName.value;}
  STATE.candidates.push(newCand);
  closeModal(); await saveAndSync(); showToast('候補者追加しました');
}
async function deleteCandidate(id) {
  if (!confirm('本当に削除しますか？')) return;
  STATE.candidates=STATE.candidates.filter(function(x){return x.id!==id;});
  closeModal(); await saveAndSync(); showToast('削除しました');
}

// ===== EXPORT / IMPORT =====
function exportData() {
  var blob = new Blob([JSON.stringify(STATE,null,2)],{type:'application/json'});
  var a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='VJP採用データ_'+new Date().toISOString().split('T')[0]+'.json'; a.click();
  showToast('エクスポートしました');
}
async function importData(e) {
  var file = e.target.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = async function(ev) {
    try {
      var data = JSON.parse(ev.target.result);
      if (data.positions && data.candidates) {
        STATE = data;
        await saveAndSync();
        showToast('インポートしました');
      } else { alert('無効なデータ形式です'); }
    } catch(err) { alert('ファイル読み込みエラー: '+err.message); }
  };
  reader.readAsText(file); e.target.value = '';
}

// ===== UTILS =====
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(function(){t.style.display='none';},2500);}

// ===== START =====
init();
</script>
